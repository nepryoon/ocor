      class ConfigError(Exception):
          pass


      def now() -> float:
          return time.time()


      def iso(ts: float | None = None) -> str:
          return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(now() if ts is None else ts))


      def canonical(obj: Any) -> bytes:
          return json.dumps(obj, sort_keys=True, separators=(",", ":"), ensure_ascii=False, allow_nan=False).encode()


      class NonStandardJSON(ValueError):
          """NaN, Infinity or a number that overflows to infinity: not JSON (RFC 8259)."""


      def _reject_constant(name: str) -> Any:
          raise NonStandardJSON(f"non-standard JSON constant {name}")


      def _finite_float(text: str) -> float:
          value = float(text)
          if not math.isfinite(value):
              raise NonStandardJSON(f"non-finite JSON number {text}")
          return value


      def strict_json(raw: bytes | str) -> Any:
          """Parse RFC 8259 JSON only: every signed record and the profile are read with it, so
          no non-finite number can reach a time, count or digest comparison."""
          return json.loads(raw, parse_constant=_reject_constant, parse_float=_finite_float)


      def finite_number(value: Any) -> float | None:
          """`value` as a float when it is a finite JSON number (not a boolean), else None."""
          if isinstance(value, (int, float)) and not isinstance(value, bool) and math.isfinite(value):
              return float(value)
          return None


      def sha256(data: bytes) -> str:
          return hashlib.sha256(data).hexdigest()


      def new_id() -> str:
          return uuid.uuid4().hex


      # --------------------------------------------------------------------------- profile


      def _positive_int(value: object) -> bool:
          return isinstance(value, int) and not isinstance(value, bool) and value > 0


      def _is_private_host(host: str) -> bool:
          if "." not in host:
              return True  # single-label intra-site service name
          parts = host.split(".")
          if len(parts) == 4 and all(p.isdigit() for p in parts):
              a, b = int(parts[0]), int(parts[1])
              return a == 10 or (a == 172 and 16 <= b <= 31) or (a == 192 and b == 168) or a == 127
          return host.endswith(".svc") or host.endswith(".cluster.local") or host.endswith(".internal")


      def validate_profile(p: dict[str, Any]) -> list[str]:
          """Return fail-closed violations of the PoC profile; empty means startable."""
          errors: list[str] = []

          def req(cond: bool, msg: str) -> None:
              if not cond:
                  errors.append(msg)

          prof = p.get("profile", {})
          req(prof.get("id") == "poc", "profile.id must be poc")
          req(prof.get("singleSite") is True, "profile.singleSite must be true")
          req(isinstance(prof.get("release"), str) and bool(prof.get("release")), "profile.release required")

          iso_ = p.get("isolation", {})
          for key in ("networkPolicyDefaultDeny", "zeroSaaSAndCallHome", "namespacePerSubsystem",
                      "serviceAccountPerSubsystem", "rootCaOutsideClusterFaultDomain",
                      "backupVaultOutsideClusterFaultDomain"):
              req(iso_.get(key) is True, f"isolation.{key} must be true")
          req(iso_.get("egressPublicNetwork") is False, "public egress must be denied")
          req(isinstance(iso_.get("syntheticCompartmentsMin"), int) and iso_["syntheticCompartmentsMin"] >= 2,
              "at least two synthetic compartments required")
          probes = iso_.get("egressDenyProbes", [])
          req(isinstance(probes, list) and len(probes) >= 1, "egress deny probes required")
          flows = iso_.get("allowedFlows", [])
          req(isinstance(flows, list) and len(flows) >= 1, "allowedFlows must be non-empty")
          flow_set = set()
          for f in flows if isinstance(flows, list) else []:
              host, port = f.get("host", ""), f.get("port")
              req(isinstance(host, str) and _is_private_host(host) and _positive_int(port) and port <= 65535,
                  f"allowed flow must be intra-site: {f}")
              flow_set.add((host, port))
          ports = [f.get("port") for f in flows] if isinstance(flows, list) else []
          req(len(ports) == len(set(ports)), "allowed flow ports must be unique")

          img = p.get("images", {})
          req(img.get("digestPinned") is True, "images must be digest-pinned")
          req(img.get("signatureVerifiedBeforeAdmission") is True, "image signature verification required")
          req(img.get("publicNetworkDependencyAtRuntime") is False, "public-network runtime dependency blocks startup")
          pins = img.get("pins", {})
          req(isinstance(pins, dict) and len(pins) >= 1, "image pins required")
          for name, ref in (pins.items() if isinstance(pins, dict) else []):
              req(isinstance(ref, str) and IMAGE_PIN.match(ref) is not None,
                  f"image pin {name} must be digest-pinned")

          req(p.get("resourceClasses") == RESOURCE_CLASSES, "resourceClasses must be CONTROL/INTERACTIVE/BATCH/AUDIT")
          req(p.get("resourceIsolation", {}).get("c6ControlAuditSharesCausalBatchPool") is False,
              "C6/control/audit must not share the causal batch pool")

          obs = p.get("observability", {})
          req(_positive_int(obs.get("driftScanIntervalSeconds")) and obs["driftScanIntervalSeconds"] <= 60,
              "drift scan interval must be in [1, 60]s")
          req(_positive_int(obs.get("probeIntervalSeconds")) and obs["probeIntervalSeconds"] <= 60,
              "probe interval must be in [1, 60]s")
          req(obs.get("releaseMismatchBlocksMutativeCommand") is True, "release mismatch must block mutative commands")
          req(obs.get("exportersLocal") is True, "exporters must stay local")
          met = obs.get("metrics", {})
          req(met.get("exporter") == "prometheus", "prometheus exporter required")
          req(set(met.get("set", [])) == METRIC_SET, "metric set incomplete")
          logs = obs.get("logs", {})
          req(set(logs.get("fields", [])) == LOG_FIELDS, "log fields incomplete")
          req(logs.get("keepClassificationMarking") is True, "classification/marking must be kept")
          req(logs.get("excludeClassifiedPayload") is True, "classified payload must be excluded")
          req(list(obs.get("traces", {}).get("fields", [])) == TRACE_FIELDS, "trace fields incomplete")

          bk = p.get("backup", {})
          for key in ("encrypted", "signed", "immutable", "contentAddressed", "authorityAware",
                      "offClusterFaultDomain", "tested"):
              req(bk.get(key) is True, f"backup.{key} must be true")
          req(_positive_int(bk.get("rpoMinutes")) and bk["rpoMinutes"] <= 15, "RPO must be in [1, 15] minutes")
          req(_positive_int(bk.get("rtoHours")) and bk["rtoHours"] <= 4, "RTO must be in [1, 4] hours")
          req(set(bk.get("authorityClasses", [])) == AUTHORITY_CLASSES, "authority classes incomplete")
          keys = bk.get("keys", {})
          req(isinstance(keys.get("transitMount"), str) and bool(keys.get("transitMount")), "backup transit mount required")
          req(isinstance(keys.get("encryption"), str) and isinstance(keys.get("signing"), str)
              and keys.get("encryption") != keys.get("signing"), "separate encryption and signing keys required")
          mem = bk.get("memory", {})
          req(set(mem.keys()) >= set(MEMORY_MANIFEST_KEYS), "memory backup manifest incomplete")
          req(isinstance(mem.get("metadataRef"), str) and bool(mem.get("metadataRef")), "memory metadata ref required")
          for key in MEMORY_MANIFEST_KEYS[1:]:
              req(mem.get(key) is True, f"memory manifest field {key} must be bound")

          rs = p.get("restore", {})
          req(rs.get("isolatedNetwork") is True, "restore must run in an isolated network")
          req(list(rs.get("steps", [])) == RESTORE_STEPS,
              "restore steps incomplete or out of order (deletion tombstones must replay before reopening retrieval)")
          rp = rs.get("replay", {})
          req(rp.get("usesOriginalEventIds") is True, "replay must use original event ids")
          req(rp.get("emitsNoExternalEffects") is True, "replay must not emit external effects")
          req(set(rp.get("pins", [])) == REPLAY_PINS, "replay pins incomplete")
          req(list(rs.get("recoveryGate", [])) == RECOVERY_GATE, "recovery gate incomplete")
          req(_positive_int(rs.get("receiptMaxAgeHours")), "restore receipt max age required")

          lim = p.get("resourceLimits", {})
          req(set(lim.keys()) >= set(RESOURCE_LIMIT_KEYS), "PoC resource limits incomplete")
          for key in RESOURCE_LIMIT_KEYS:
              req(_positive_int(lim.get(key)), f"resource limit {key} must be positive")
          qb = lim.get("quotaBehavior", {})
          req(qb.get("onExceed") == "quota_backpressure", "quota behavior must be backpressure")
          req(qb.get("semanticDowngrade") is False, "quota/backpressure must never produce semantic downgrade")

          faults: dict[str, set[str]] = {}
          for entry in p.get("safeDegraded", {}).get("faults", []):
              faults[entry.get("fault")] = set(entry.get("behavior", []))
          req(set(faults) == set(SAFE_DEGRADED_FAULTS), "safe-degraded fault table incomplete")
          for name, behavior in SAFE_DEGRADED_FAULTS.items():
              req(faults.get(name) == behavior, f"safe-degraded behavior for {name} incomplete")

          hl = p.get("health", {})
          req(set(hl.get("probeTypes", [])) == {"liveness", "readiness"}, "liveness+readiness probes required")
          deps = hl.get("dependencies", [])
          req(isinstance(deps, list) and len(deps) >= 1, "health.dependencies must be non-empty")
          names = [d.get("name") for d in deps] if isinstance(deps, list) else []
          req(set(names) == MANDATORY_DEPENDENCIES and len(names) == len(set(names)),
              "health dependencies must cover every mandatory foundation service exactly once")
          for d in deps if isinstance(deps, list) else []:
              nm = d.get("name")
              req(d.get("mandatory") is True, f"dependency {nm} must be mandatory")
              req(d.get("probe", {}).get("kind") in PROBE_KINDS, f"health probe missing for {nm}")
              req(isinstance(d.get("host"), str) and _positive_int(d.get("port")), f"health endpoint missing for {nm}")
              req((d.get("host"), d.get("port")) in flow_set, f"dependency {nm} endpoint not in allowedFlows")
              req(d.get("faultClass") in FAULT_DENIES, f"dependency {nm} fault class unknown")
          return errors


      def load_profile(path: Path) -> tuple[dict[str, Any], str]:
          raw = path.read_bytes()
          try:
              profile = strict_json(raw)
          except ValueError as exc:
              raise ConfigError(f"profile is not JSON: {exc}") from exc
          if not isinstance(profile, dict):
              raise ConfigError("profile must be an object")
          errors = validate_profile(profile)
          if errors:
              raise ConfigError("; ".join(errors))
          return profile, sha256(canonical(profile))


      # --------------------------------------------------------------------------- telemetry


      class Telemetry:
          """Local Prometheus exporter state, structured logs and trace spans (ADD 6.3)."""

          def __init__(self, release: str, config_digest: str) -> None:
              self.release = release
              self.config_digest = config_digest
              self.policy_digest: str | None = None
              self.lock = threading.Lock()
              self.counters: dict[tuple[str, tuple[tuple[str, str], ...]], float] = {}
              self.gauges: dict[tuple[str, tuple[tuple[str, str], ...]], float] = {}
              self.samples: dict[str, list[float]] = {}
              self.spans: list[dict[str, Any]] = []

          def log(self, operation: str, reason_code: str, correlation_id: str, level: str = "INFO",
                  **extra: Any) -> None:
              record = {
                  "ts": iso(), "level": level, "component": COMPONENT, "operation": operation,
                  "release": self.release, "config_digest": self.config_digest,
                  "policy_digest": self.policy_digest, "reason_code": reason_code,
                  "correlation_id": correlation_id, "classification_marking_ref": MARKING,
              }
              record.update(extra)
              sys.stdout.write(json.dumps(record, sort_keys=True) + "\n")
              sys.stdout.flush()

          def inc(self, name: str, value: float = 1.0, **labels: str) -> None:
              key = (name, tuple(sorted(labels.items())))
              with self.lock:
                  self.counters[key] = self.counters.get(key, 0.0) + value

          def gauge(self, name: str, value: float, **labels: str) -> None:
              with self.lock:
                  self.gauges[(name, tuple(sorted(labels.items())))] = value

          def observe(self, dependency: str, seconds: float) -> None:
              with self.lock:
                  bucket = self.samples.setdefault(dependency, [])
                  bucket.append(seconds)
                  del bucket[:-512]
                  self.counters[("ocor_dependency_probe_duration_seconds_count", (("dependency", dependency),))] = (
                      self.counters.get(("ocor_dependency_probe_duration_seconds_count", (("dependency", dependency),)), 0.0) + 1)
                  self.counters[("ocor_dependency_probe_duration_seconds_sum", (("dependency", dependency),))] = (
                      self.counters.get(("ocor_dependency_probe_duration_seconds_sum", (("dependency", dependency),)), 0.0) + seconds)

          def span(self, operation: str, correlation_id: str, trace_id: str, causation_id: str | None,
                   start: float, status: str, reason_code: str, **attrs: Any) -> str:
              span_id = new_id()[:16]
              record: dict[str, Any] = {name: None for name in TRACE_FIELDS}
              record.update({
                  "trace_id": trace_id, "span_id": span_id, "correlation_id": correlation_id,
                  "causation_id": causation_id, "classification_marking_ref": MARKING,
                  "policy_bundle_digest": self.policy_digest, "component": COMPONENT,
                  "operation": operation, "release": self.release, "status": status,
                  "reason_code": reason_code, "start": iso(start), "duration_seconds": round(now() - start, 6),
                  "unavailable_fields": "not produced by the ops plane at G4; emitted by C1-C8 boundaries",
              })
              record.update(attrs)
              with self.lock:
                  self.spans.append(record)
                  del self.spans[:-1000]
              self.log("span", reason_code, correlation_id, span=record)
              return span_id

          def render(self) -> str:
              lines: list[str] = []
              with self.lock:
                  for (name, labels), value in sorted(self.counters.items()):
                      lines.append(f"{name}{_labels(labels)} {value}")
                  for (name, labels), value in sorted(self.gauges.items()):
                      lines.append(f"{name}{_labels(labels)} {value}")
                  for dep, values in sorted(self.samples.items()):
                      ordered = sorted(values)
                      for q in (0.5, 0.95, 0.99):
                          idx = min(len(ordered) - 1, int(round(q * (len(ordered) - 1))))
                          lines.append(
                              f'ocor_dependency_probe_duration_seconds{{dependency="{dep}",quantile="{q}"}} {ordered[idx]}')
              return "\n".join(lines) + "\n"


      def _labels(labels: tuple[tuple[str, str], ...]) -> str:
          if not labels:
              return ""
          return "{" + ",".join(f'{k}="{v}"' for k, v in labels) + "}"


      # --------------------------------------------------------------------------- probes


      def http_status(host: str, port: int, path: str, timeout: float) -> tuple[int, bytes]:
          conn = http.client.HTTPConnection(host, port, timeout=timeout)
          try:
              conn.request("GET", path)
              resp = conn.getresponse()
              return resp.status, resp.read(4096)
          finally:
              conn.close()


      def probe_postgres(host: str, port: int, timeout: float, user: str, database: str) -> None:
          params = f"user\0{user}\0database\0{database}\0\0".encode()
          packet = struct.pack("!ii", 8 + len(params), 196608) + params
          with socket.create_connection((host, port), timeout) as s:
              s.settimeout(timeout)
              s.sendall(packet)
              kind = s.recv(1)
              if kind != b"R":
                  raise OSError(f"postgres startup refused: {kind!r}")


      def probe_kafka(host: str, port: int, timeout: float) -> None:
          client = b"ocor-ops"
          body = struct.pack("!hhih", 18, 0, 7349, len(client)) + client
          with socket.create_connection((host, port), timeout) as s:
              s.settimeout(timeout)
              s.sendall(struct.pack("!i", len(body)) + body)
              head = b""
              while len(head) < 10:
                  chunk = s.recv(10 - len(head))
                  if not chunk:
                      raise OSError("kafka closed connection")
                  head += chunk
              _, corr, err = struct.unpack("!iih", head)
              if corr != 7349 or err != 0:
                  raise OSError(f"kafka ApiVersions error={err}")


      def probe_tls_spiffe(host: str, port: int, timeout: float) -> None:
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          ctx.set_alpn_protocols(["h2"])
          with socket.create_connection((host, port), timeout) as raw, ctx.wrap_socket(raw) as tls:
              der = tls.getpeercert(binary_form=True) or b""
              if b"spiffe://" not in der:
                  raise OSError("peer certificate carries no SPIFFE ID")


      def run_probe(dep: dict[str, Any], timeout: float) -> None:
          probe, host, port = dep["probe"], dep["host"], dep["port"]
          kind = probe["kind"]
          if kind == "http":
              status, body = http_status(host, port, probe["path"], timeout)
              if status not in probe.get("expectStatus", [200]):
                  raise OSError(f"http status {status}")
              needle = probe.get("expectBody")
              if needle and needle.encode() not in body:
                  raise OSError("http body mismatch")
          elif kind == "postgres_startup":
              probe_postgres(host, port, timeout, probe.get("user", "ocor"), probe.get("database", "ocor"))
          elif kind == "kafka_api_versions":
              probe_kafka(host, port, timeout)
          elif kind == "tls_spiffe":
              probe_tls_spiffe(host, port, timeout)
          else:
              raise OSError(f"unknown probe kind {kind}")


      def egress_open(target: str, timeout: float) -> bool:
          host, _, port = target.rpartition(":")
          try:
              socket.create_connection((host, int(port)), timeout).close()
              return True
          except OSError:
              return False


      # --------------------------------------------------------------------------- OpenBao transit


      @dataclass
      class Transit:
          addr: str
          token: str
          mount: str

          def call(self, method: str, path: str, body: dict[str, Any] | None = None) -> dict[str, Any]:
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(f"{self.addr}/v1/{path}", data=data, method=method,
                                           headers={"X-Vault-Token": self.token, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw = resp.read()
              except urllib.error.HTTPError as exc:
                  raise OSError(f"openbao {method} {path.split('/')[0]} -> {exc.code}") from None
              return json.loads(raw) if raw else {}

          def ensure_keys(self, enc: str, sign: str) -> None:
              mounts = self.call("GET", "sys/mounts")
              if f"{self.mount}/" not in mounts.get("data", mounts):
                  self.call("POST", f"sys/mounts/{self.mount}", {"type": "transit"})
              self.call("POST", f"{self.mount}/keys/{enc}", {"type": "aes256-gcm96"})
              self.call("POST", f"{self.mount}/keys/{sign}", {"type": "ed25519"})

          def encrypt(self, key: str, data: bytes) -> list[str]:
              chunks = [data[i:i + 1048576] for i in range(0, len(data), 1048576)] or [b""]
              return [self.call("POST", f"{self.mount}/encrypt/{key}",
                                {"plaintext": base64.b64encode(c).decode()})["data"]["ciphertext"] for c in chunks]

          def decrypt(self, key: str, chunks: list[str]) -> bytes:
              return b"".join(base64.b64decode(self.call("POST", f"{self.mount}/decrypt/{key}",
                                                         {"ciphertext": c})["data"]["plaintext"]) for c in chunks)

          def sign(self, key: str, data: bytes) -> str:
              return str(self.call("POST", f"{self.mount}/sign/{key}",
                                   {"input": base64.b64encode(data).decode()})["data"]["signature"])

          def verify(self, key: str, data: bytes, signature: str) -> bool:
              try:
                  out = self.call("POST", f"{self.mount}/verify/{key}",
                                  {"input": base64.b64encode(data).decode(), "signature": signature})
              except OSError:
                  return False
              return bool(out.get("data", {}).get("valid"))

          def public_key(self, key: str) -> dict[str, Any]:
              keys = self.call("GET", f"{self.mount}/keys/{key}")["data"]["keys"]
              return {str(k): v.get("public_key") for k, v in keys.items()}


      def transit_from_env(profile: dict[str, Any]) -> Transit:
          token = os.environ.get("OCOR_OPENBAO_TOKEN", "")
          if not token:
              raise ConfigError("OCOR_OPENBAO_TOKEN is required")
          addr = os.environ.get("OCOR_OPENBAO_ADDR", "http://openbao:8200")
          return Transit(addr, token, profile["backup"]["keys"]["transitMount"])


      # --------------------------------------------------------------------------- vault


      def write_immutable(path: Path, data: bytes) -> None:
          path.parent.mkdir(parents=True, exist_ok=True)
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o444)
          with os.fdopen(fd, "wb") as fh:
              fh.write(data)


      def erase_tree(root: Path) -> None:
          """Remove staged plaintext once it has been sealed or restored."""
          for path in sorted(root.rglob("*"), reverse=True):
              if path.is_file() or path.is_symlink():
                  path.unlink()
              elif path.is_dir():
                  path.rmdir()


      def recovery_points(vault: Path) -> list[Path]:
          root = vault / "recovery-points"
          return sorted((p for p in root.iterdir() if (p / "manifest.json").exists()), key=lambda p: p.name) \
              if root.exists() else []


      def verify_manifest(transit: Transit, profile: dict[str, Any], rp_dir: Path) -> dict[str, Any]:
          raw = (rp_dir / "manifest.json").read_bytes()
          signature = (rp_dir / "manifest.sig").read_text().strip()
          if not transit.verify(profile["backup"]["keys"]["signing"], raw, signature):
              raise ValueError("SIGNATURE_INVALID")
          manifest = strict_json(raw)
          if not isinstance(manifest, dict) or manifest.get("schema") != MANIFEST_SCHEMA:
              raise ValueError("MANIFEST_SCHEMA_INVALID")
          if manifest.get("recovery_point") != rp_dir.name:
              raise ValueError("RECOVERY_POINT_MISMATCH")
          return manifest


      def release_binding(profile: dict[str, Any], profile_digest: str) -> dict[str, str]:
          """Release, profile digest and image pins a recovery point or receipt is bound to
          (ADD v1.3 6.3/6.5 release fence; FR-156 compatibility before switch)."""
          return {"release": str(profile["profile"]["release"]), "profile_digest": profile_digest,
                  "image_pins_digest": sha256(canonical(profile["images"]["pins"]))}


      def manifest_binding(manifest: dict[str, Any]) -> dict[str, Any]:
          return {"release": manifest.get("release"), "profile_digest": manifest.get("profile_digest"),
                  "image_pins_digest": sha256(canonical(manifest.get("image_pins")))}


      def binding_mismatch(binding: Any, profile: dict[str, Any], profile_digest: str) -> str | None:
          """None when `binding` is exactly the current release binding, else the reason
          code of the first difference (missing or malformed counts as a difference)."""
          expected = release_binding(profile, profile_digest)
          if not isinstance(binding, dict) or binding.get("release") != expected["release"]:
              return "RELEASE_MISMATCH"
          if binding.get("image_pins_digest") != expected["image_pins_digest"]:
              return "PINS_MISMATCH"
          if binding.get("profile_digest") != expected["profile_digest"]:
              return "PROFILE_MISMATCH"
          return None


      NO_MEMORY_DETAIL = "no memory store present"
      MEMORY_GATES = ["watermark", "orphan_duplicate", "marking", "gcs", "deletion_resurrection",
                      "projection_drift_or_stale_deletion_epoch"]
      MEMORY_STEP = RESTORE_STEPS.index("replay_memory_deletion_tombstones_before_reopen_retrieval")


      def _count(value: Any) -> bool:
          return isinstance(value, int) and not isinstance(value, bool) and value >= 0


      def _empty_lists(detail: Any, keys: list[str]) -> bool:
          return isinstance(detail, dict) and sorted(detail) == sorted(keys) and all(detail[k] == [] for k in keys)


      def gate_detail_coherent(name: str, detail: Any, memory_present: bool) -> bool:
          """The typed detail a PASSED check carries, exactly as restore-finalize writes it: a
          pass=true entry whose detail names a violation (tenant, compartment, GCS, marking,
          orphan, duplicate, resurrection, drift, digest or count difference) is incoherent
          (LLD v1.1 5.4: every recovery-gate check passes before traffic reopens)."""
          if name in ("revision", "sample_semantic_digest"):
              return bool(detail == [])
          if not memory_present:
              return bool(detail == NO_MEMORY_DETAIL)
          if name == "deletion_resurrection":
              return bool(detail == [])
          if name == "gcs":
              return _empty_lists(detail, ["tenant_mismatch", "compartment_mismatch", "gcs_digest_mismatch"])
          if name == "marking":
              return _empty_lists(detail, ["marking_mismatch"])
          if name == "orphan_duplicate":
              return _empty_lists(detail, ["orphans", "dupes"])
          if name == "watermark":
              return (isinstance(detail, dict) and sorted(detail) == ["index_items", "live_metadata_items"]
                      and _count(detail["index_items"]) and detail["index_items"] == detail["live_metadata_items"])
          if name == "projection_drift_or_stale_deletion_epoch":
              return (isinstance(detail, dict)
                      and sorted(detail) == ["journal_max", "metadata_max", "missing_live", "version_drift"]
                      and _count(detail["journal_max"]) and _count(detail["metadata_max"])
                      and detail["journal_max"] >= detail["metadata_max"]
                      and detail["missing_live"] == [] and detail["version_drift"] == [])
          return False


      def receipt_inconsistencies(receipt: Any, profile: dict[str, Any]) -> list[str]:
          """Structural and semantic coherence of a signed receipt claiming PASSED: a valid
          signature does not make a record with a failed or missing check, or with a check that
          passes while its detail reports a violation, coherent (LLD v1.1 5.4: every recovery
          gate check passes before traffic reopens). Empty means coherent."""
          if not isinstance(receipt, dict):
              return ["receipt:not_an_object"]
          out: list[str] = []
          if receipt.get("schema") != RECEIPT_SCHEMA:
              out.append("schema")
          if receipt.get("outcome") != "PASSED":
              out.append("outcome")
          if not isinstance(receipt.get("recovery_point"), str) or not receipt["recovery_point"]:
              out.append("recovery_point")
          if not isinstance(receipt.get("manifest_digest"), str) or not SHA256_HEX.match(receipt["manifest_digest"]):
              out.append("manifest_digest")
          steps = receipt.get("steps")
          expected_steps = list(profile["restore"]["steps"])
          memory_present: bool | None = None
          if (not isinstance(steps, list) or not all(isinstance(s, dict) for s in steps)
                  or [s.get("step") for s in steps] != expected_steps):
              out.append("steps")
          else:
              for index, entry in enumerate(steps):
                  status = entry.get("status")
                  if index == len(steps) - 1:
                      ok = status == "PENDING_HUMAN_AUTHORIZATION"
                  elif index == MEMORY_STEP:
                      # Tombstones are replayed when a memory store is present, else not applicable.
                      ok = status in ("EXECUTED", "NOT_APPLICABLE")
                      memory_present = status == "EXECUTED" if ok else None
                  elif index in STEPS_EXECUTED_WHEN_PASSED:
                      ok = status == "EXECUTED"
                  else:
                      ok = status in STEP_STATUSES_WHEN_PASSED
                  if not ok:
                      out.append(f"step:{entry.get('step')}")
          gate = receipt.get("recovery_gate")
          required = list(profile["restore"]["recoveryGate"])
          if not isinstance(gate, dict):
              out.append("recovery_gate")
          else:
              out.extend(f"gate:{name}:unexpected" for name in sorted(set(gate) - set(required)))
              for name in required:
                  entry = gate.get(name)
                  if not isinstance(entry, dict) or entry.get("pass") is not True:
                      out.append(f"gate:{name}")
                  elif sorted(entry) != ["detail", "pass"] or memory_present is None or not gate_detail_coherent(
                          name, entry["detail"], memory_present):
                      out.append(f"gate:{name}:detail")
          replayed = receipt.get("replayed_event_ids")
          if not isinstance(replayed, list) or not all(isinstance(e, str) and e for e in replayed) or (
                  memory_present is False and replayed):
              out.append("replayed_event_ids")
          for key in ("replay_digest", "restored_scope_digest"):
              value = receipt.get(key)
              if memory_present is False and value is not None or memory_present is not False and (
                      not isinstance(value, str) or not SHA256_HEX.match(value)):
                  out.append(key)
          stores = receipt.get("restored_store_digests")
          if not isinstance(stores, dict) or not stores or not all(
                  isinstance(k, str) and k and isinstance(v, str) and SHA256_HEX.match(v) for k, v in stores.items()):
              out.append("restored_store_digests")
          if receipt.get("quarantined_items") != []:
              out.append("quarantined_items")
          if receipt.get("materialisation") != "ALLOWED_PENDING_HUMAN":
              out.append("materialisation")
          if receipt.get("retrieval_reopened") is not False:
              out.append("retrieval_reopened")
          if receipt.get("isolated_network") is not True:
              out.append("isolated_network")
          completed = finite_number(receipt.get("completed_at_epoch"))
          if completed is None or completed <= 0 or completed > now() + RECEIPT_CLOCK_SKEW_SECONDS:
              out.append("completed_at_epoch")
          elif receipt.get("completed_at") != iso(completed):
              out.append("completed_at")
          duration = finite_number(receipt.get("duration_seconds"))
          if duration is None or duration < 0:
              out.append("duration_seconds")
          return out


      def _sha256_hex(value: Any) -> bool:
          return isinstance(value, str) and SHA256_HEX.match(value) is not None


      def receipt_recovery_point_inconsistencies(receipt: dict[str, Any], manifest: dict[str, Any]) -> list[str]:
          """Bindings of a structurally coherent PASSED receipt to the signed recovery point it
          restored that hold with or without a memory store: the restore cannot precede the
          seal, and every restored store reproduces the table digests sealed for it (LLD v1.1
          5.4 revision and semantic-digest checks). Empty means coherent."""
          out: list[str] = []
          created = finite_number(manifest.get("created_at_epoch"))
          if created is None or float(receipt["completed_at_epoch"]) < created:
              out.append("receipt:completed_before_recovery_point")
          sealed = manifest.get("store_digests")
          if (not isinstance(sealed, dict) or not sealed or not all(_sha256_hex(v) for v in sealed.values())
                  or receipt["restored_store_digests"] != sealed):
              out.append("receipt:store_digests_mismatch")
          return out


      def receipt_checkpoint_inconsistencies(receipt: dict[str, Any], memory: dict[str, Any]) -> list[str]:
          """Coherence of a structurally coherent PASSED receipt with the memory store of the
          signed recovery point it restored (Part II 2.13; ADD 6.5 step 6): the replayed ids are
          exactly the signed, ordered tombstone sequence (its digest), each replayed once with
          its original event id; the deletion epochs the gate measured are the checkpointed
          ones; the restored projection is the sealed live set with its sealed isolation scope.
          An epoch below the checkpoint means tombstones were not replayed (resurrection risk);
          one above it was not restored from this recovery point. Empty means coherent."""
          checkpoint, epochs = memory.get("journalCheckpoints"), memory.get("deletionEpochs")
          live = memory.get("liveItems")
          if (not isinstance(checkpoint, dict) or not isinstance(epochs, dict) or not _count(checkpoint.get("entries"))
                  or not _sha256_hex(checkpoint.get("event_ids_digest"))):
              return ["memory:checkpoint_missing"]
          if (not isinstance(live, dict) or not _count(live.get("count")) or not _sha256_hex(live.get("ids_digest"))
                  or not _sha256_hex(live.get("scope_digest"))):
              return ["memory:live_items_missing"]
          out: list[str] = []
          replayed = receipt["replayed_event_ids"]
          if (event_ids_digest(replayed) != checkpoint["event_ids_digest"]
                  or len(replayed) != checkpoint["entries"] or len(set(replayed)) != len(replayed)
                  or (replayed[-1] if replayed else None) != checkpoint.get("last_event_id")):
              out.append("memory:tombstones_not_replayed")
          detail = receipt["recovery_gate"]["projection_drift_or_stale_deletion_epoch"]["detail"]
          if not detail["journal_max"] == checkpoint.get("max_deletion_epoch") == epochs.get("journal_max"):
              out.append("memory:deletion_epoch_checkpoint_mismatch")
          if detail["metadata_max"] != epochs.get("metadata_max"):
              out.append("memory:metadata_epoch_mismatch")
          if (receipt["replay_digest"] != live["ids_digest"]
                  or receipt["recovery_gate"]["watermark"]["detail"]["index_items"] != live["count"]):
              out.append("memory:live_items_mismatch")
          if receipt["restored_scope_digest"] != live["scope_digest"]:
              out.append("memory:restored_scope_mismatch")
          return out


      def latest_valid_receipt(transit: Transit, profile: dict[str, Any], profile_digest: str,
                               vault: Path) -> tuple[str, dict[str, Any] | None, str | None, list[str]]:
          """Return (reason_code, receipt, receipt_digest, detail). READY only with a signed,
          coherent PASSED receipt bound to a signed recovery point of the CURRENT release,
          profile and image pins (negative criterion: untested restore blocks readiness).
          The digest identifies the receipt a human reopening binds to."""
          root = vault / "restore-receipts"
          files = sorted(root.glob("*.json")) if root.exists() else []
          if not files:
              return "RESTORE_UNTESTED", None, None, []
          path = files[-1]
          raw = path.read_bytes()
          sig_path = path.with_suffix(".sig")
          if not sig_path.exists() or not transit.verify(profile["backup"]["keys"]["signing"], raw,
                                                         sig_path.read_text().strip()):
              return "RESTORE_RECEIPT_INVALID", None, None, []
          try:
              receipt = strict_json(raw)
          except NonStandardJSON:
              return "RESTORE_RECEIPT_INCONSISTENT", None, None, ["receipt:non_standard_json"]
          except ValueError:
              return "RESTORE_RECEIPT_INCONSISTENT", None, None, ["receipt:not_json"]
          if isinstance(receipt, dict) and receipt.get("outcome") == "FAILED":
              return "RESTORE_FAILED", receipt, None, []
          problems = receipt_inconsistencies(receipt, profile)
          if problems:
              return "RESTORE_RECEIPT_INCONSISTENT", receipt if isinstance(receipt, dict) else None, None, problems
          max_age = profile["restore"]["receiptMaxAgeHours"] * 3600
          if now() - float(receipt["completed_at_epoch"]) > max_age:
              return "RESTORE_RECEIPT_EXPIRED", receipt, None, []
          rp_dir = vault / "recovery-points" / receipt["recovery_point"]
          try:
              manifest = verify_manifest(transit, profile, rp_dir)
          except (OSError, ValueError) as exc:
              return "RESTORE_RECEIPT_UNBOUND", receipt, None, [str(exc) if isinstance(exc, ValueError)
                                                                else type(exc).__name__]
          if sha256(canonical(manifest)) != receipt["manifest_digest"]:
              return "RESTORE_RECEIPT_UNBOUND", receipt, None, ["manifest_digest"]
          problems = receipt_recovery_point_inconsistencies(receipt, manifest)
          if problems:
              return "RESTORE_RECEIPT_INCONSISTENT", receipt, None, problems
          memory = manifest.get("memory")
          manifest_memory = isinstance(memory, dict) and memory.get("status") == "PRESENT"
          if (receipt["steps"][MEMORY_STEP]["status"] == "EXECUTED") is not manifest_memory:
              # The receipt's memory branch must be the one of the recovery point it restored.
              return "RESTORE_RECEIPT_INCONSISTENT", receipt, None, ["memory:manifest_mismatch"]
          if manifest_memory and isinstance(memory, dict):
              problems = receipt_checkpoint_inconsistencies(receipt, memory)
              if problems:
                  return "RESTORE_RECEIPT_INCONSISTENT", receipt, None, problems
          # Release fence: the tested restore must belong to the running release, profile and
          # pins, both for the recovery point and for the restore that produced the receipt.
          for subject, binding in (("recovery_point", manifest_binding(manifest)),
                                   ("receipt", receipt.get("release_binding"))):
              mismatch = binding_mismatch(binding, profile, profile_digest)
              if mismatch is not None:
                  return f"RESTORE_{mismatch}", receipt, None, [subject]
          return "RESTORE_TESTED", receipt, sha256(raw), []


      # --------------------------------------------------------------------------- serve


      @dataclass
      class State:
          profile: dict[str, Any]
          config_digest: str
          profile_path: Path
          vault: Path | None
          telemetry: Telemetry
          dep_up: dict[str, bool] = field(default_factory=dict)
          dep_reason: dict[str, str] = field(default_factory=dict)
          egress_violations: list[str] = field(default_factory=list)
          restore_reason: str = "RESTORE_UNTESTED"
          drift: bool = False
          stop_epoch: int = 0
          stopped_at: float | None = None
          last_scan: float = 0.0
          ready: bool = False
          ready_reasons: list[str] = field(default_factory=lambda: ["NOT_YET_SCANNED"])
          scanner_error: str | None = None
          max_scan_age: float = 60.0
          receipt_digest: str | None = None
          restore_detail: list[str] = field(default_factory=list)
          reopen: dict[str, Any] | None = None
          policy_reason: str = "POLICY_INVENTORY_NOT_YET_READ"
          lock: threading.Lock = field(default_factory=threading.Lock)

          def scan_fresh(self) -> bool:
              return self.scanner_error is None and self.last_scan > 0 and now() - self.last_scan <= self.max_scan_age

          def readiness(self) -> tuple[bool, list[str]]:
              if self.scanner_error is not None:
                  return False, ["SCANNER_ERROR"]
              if self.last_scan > 0 and not self.scan_fresh():
                  return False, ["SCAN_STALE"]
              return self.ready, list(self.ready_reasons)

          def reopen_authorized(self) -> bool:
              return self.reopen is not None and self.reopen.get("receipt_digest") == self.receipt_digest

          def faults(self) -> list[str]:
              out = set()
              for dep in self.profile["health"]["dependencies"]:
                  if not self.dep_up.get(dep["name"], False):
                      out.add(dep["faultClass"])
                      out.update(dep.get("additionalFaultClasses", []))
              if self.stopped_at is not None:
                  out.add("emergency_stop")
              if self.drift:
                  out.add("release_mismatch")
              if not self.scan_fresh():
                  out.add("security_scan_unavailable")
              if self.restore_reason != "RESTORE_TESTED" or self.receipt_digest is None:
                  out.add("restore_not_verified")
              elif not self.reopen_authorized():
                  out.add("recovery_reopen_pending")
              if self.egress_violations:
                  out.add("isolation_breach")
              return sorted(out)

          def posture(self) -> dict[str, Any]:
              faults = self.faults()
              denied = sorted(set().union(*(FAULT_DENIES[f] for f in faults)) if faults else set())
              ready, reasons = self.readiness()
              return {
                  "faults": faults, "denied_operation_classes": denied,
                  "admitted_operation_classes": sorted(OPERATION_CLASSES - set(denied)),
                  "projection_freshness_claim": "broker_unavailable" not in faults
                  and "projection_lag_or_failure" not in faults,
                  "consistency": "PROJECTION_NOT_READY" if "projection_lag_or_failure" in faults else "AVAILABLE",
                  "stop_epoch": self.stop_epoch, "not_observable_by_ops_plane": NOT_OBSERVABLE_BY_OPS,
                  "ready": ready, "ready_reasons": reasons, "last_scan": iso(self.last_scan),
                  "restore": {"reason_code": self.restore_reason, "receipt_digest": self.receipt_digest,
                              "detail": list(self.restore_detail)},
                  "reopen": {"authorized": self.reopen_authorized(), "authorization": self.reopen},
                  "policy": {"digest": self.telemetry.policy_digest, "reason_code": self.policy_reason},
              }


      def policy_inventory_digest(host: str, port: int, timeout: float,
                                  limit: int = POLICY_INVENTORY_MAX_BYTES) -> tuple[str | None, str]:
          """(digest, reason_code) of the complete OPA policy inventory (ADD 6.3 / LLD 5.3: the
          policy digest carried by logs and traces). The whole inventory is read up to an explicit
          bound; an oversized, truncated, malformed or unavailable inventory yields NO digest and
          an explicit reason code, never the digest of a partial or empty set."""
          conn = http.client.HTTPConnection(host, port, timeout=timeout)
          try:
              conn.request("GET", "/v1/policies")
              resp = conn.getresponse()
              if resp.status != 200:
                  return None, "POLICY_INVENTORY_UNAVAILABLE"
              declared = resp.getheader("Content-Length")
              if declared is not None and (not declared.isdigit() or int(declared) > limit):
                  return None, "POLICY_INVENTORY_TOO_LARGE"
              body = resp.read(limit + 1)
              if len(body) > limit:
                  return None, "POLICY_INVENTORY_TOO_LARGE"
              if declared is not None and len(body) != int(declared):
                  return None, "POLICY_INVENTORY_TRUNCATED"
          except http.client.IncompleteRead:
              return None, "POLICY_INVENTORY_TRUNCATED"
          except (OSError, http.client.HTTPException):
              return None, "POLICY_INVENTORY_UNAVAILABLE"
          finally:
              conn.close()
          try:
              document = strict_json(body)
          except ValueError:
              return None, "POLICY_INVENTORY_MALFORMED"
          result = document.get("result") if isinstance(document, dict) else None
          if not isinstance(result, list) or not all(
                  isinstance(p, dict) and isinstance(p.get("id"), str) and p["id"] and isinstance(p.get("raw"), str)
                  for p in result):
              return None, "POLICY_INVENTORY_MALFORMED"
          ids = [p["id"] for p in result]
          if len(ids) != len(set(ids)):
              return None, "POLICY_INVENTORY_MALFORMED"
          return sha256(canonical(sorted([p["id"], sha256(p["raw"].encode())] for p in result))), "POLICY_DIGEST_OK"


      def policy_digest(profile: dict[str, Any]) -> tuple[str | None, str]:
          opa = next(d for d in profile["health"]["dependencies"] if d["name"] == "opa")
          return policy_inventory_digest(opa["host"], opa["port"], float(profile["health"].get("probeTimeoutSeconds", 3)))


      def scan(state: State) -> None:
          t = state.telemetry
          prof = state.profile
          correlation = new_id()
          trace = new_id()
          start = now()
          root_span = new_id()[:16]
          timeout = float(prof["health"].get("probeTimeoutSeconds", 3))
          for dep in prof["health"]["dependencies"]:
              s = now()
              reason = "DEPENDENCY_UP"
              detail = ""
              try:
                  run_probe(dep, timeout)
                  up = True
              except (OSError, ValueError, ssl.SSLError) as exc:
                  up = False
                  reason = "DEPENDENCY_DOWN"
                  t.inc("ocor_dependency_probe_errors_total", dependency=dep["name"], reason_code=reason)
                  detail = type(exc).__name__
              elapsed = now() - s
              t.observe(dep["name"], elapsed)
              t.gauge("ocor_dependency_up", 1.0 if up else 0.0, dependency=dep["name"])
              previous = state.dep_up.get(dep["name"])
              with state.lock:
                  state.dep_up[dep["name"]] = up
                  state.dep_reason[dep["name"]] = reason
              if previous is not up:
                  t.span("dependency_probe", correlation, trace, root_span, s, "OK" if up else "ERROR", reason,
                         dependency=dep["name"], fault_class=None if up else dep["faultClass"],
                         error_type=None if up else detail)
          violations = [tgt for tgt in prof["isolation"]["egressDenyProbes"] if egress_open(tgt, 2.0)]
          t.gauge("ocor_egress_public_reachable", float(len(violations)))
          current = sha256(canonical(strict_json(state.profile_path.read_bytes())))
          drift = current != state.config_digest
          t.inc("ocor_config_drift_scans_total")
          t.gauge("ocor_config_drift_detected", 1.0 if drift else 0.0)
          restore_reason, receipt_digest = "RESTORE_UNTESTED", None
          restore_detail: list[str] = []
          if state.vault is not None:
              try:
                  restore_reason, receipt, receipt_digest, restore_detail = latest_valid_receipt(
                      transit_from_env(prof), prof, state.config_digest, state.vault)
                  if receipt and restore_reason == "RESTORE_TESTED":
                      t.gauge("ocor_restore_receipt_age_seconds", now() - float(receipt["completed_at_epoch"]))
                  points = recovery_points(state.vault)
                  if points:
                      manifest = strict_json((points[-1] / "manifest.json").read_bytes())
                      age = now() - float(manifest["created_at_epoch"])
                      t.gauge("ocor_recovery_point_age_seconds", age)
                      t.gauge("ocor_recovery_point_within_rpo", 1.0 if age <= prof["backup"]["rpoMinutes"] * 60 else 0.0)
              except (OSError, ValueError, ConfigError, KeyError, TypeError) as exc:
                  restore_reason, receipt_digest, restore_detail = ("RESTORE_VERIFICATION_UNAVAILABLE", None,
                                                                    [type(exc).__name__])
          t.gauge("ocor_restore_tested", 1.0 if restore_reason == "RESTORE_TESTED" else 0.0)
          pd, pd_reason = policy_digest(prof)
          t.gauge("ocor_policy_digest_available", 1.0 if pd is not None else 0.0)
          if pd is None:
              t.inc("ocor_policy_digest_errors_total", reason_code=pd_reason)
          reasons: list[str] = []
          with state.lock:
              state.egress_violations = violations
              state.drift = drift
              state.restore_reason = restore_reason
              state.receipt_digest = receipt_digest
              state.restore_detail = restore_detail
              if state.reopen is not None and state.reopen.get("receipt_digest") != receipt_digest:
                  state.reopen = None  # an authorization never outlives the receipt it was bound to
              state.scanner_error = None
              policy_changed = (t.policy_digest, state.policy_reason) != (pd, pd_reason)
              t.policy_digest, state.policy_reason = pd, pd_reason
              for dep in prof["health"]["dependencies"]:
                  if not state.dep_up.get(dep["name"]):
                      reasons.append(f"DEPENDENCY_DOWN:{dep['name']}")
              if violations:
                  reasons.append("PUBLIC_EGRESS_OPEN")
              if drift:
                  reasons.append("RELEASE_DRIFT")
              if restore_reason != "RESTORE_TESTED":
                  reasons.append(restore_reason)
              was_reasons = list(state.ready_reasons)
              state.ready = not reasons
              state.ready_reasons = reasons or ["READY"]
              state.last_scan = now()
          if policy_changed:
              t.span("policy_inventory", correlation, trace, None, start, "OK" if pd is not None else "ERROR", pd_reason)
          t.gauge("ocor_readiness_ready", 1.0 if not reasons else 0.0)
          for r in reasons:
              t.inc("ocor_readiness_denials_total", reason_code=r.split(":")[0])
          publish_faults(state)
          if was_reasons != state.ready_reasons:
              t.span("readiness_scan", correlation, trace, None, start, "OK" if not reasons else "DENY",
                     "READY" if not reasons else reasons[0].split(":")[0], ready_reasons=state.ready_reasons)


      def publish_faults(state: State) -> None:
          with state.lock:
              active = state.faults()
              reopened = state.reopen_authorized()
          t = state.telemetry
          for f in active:
              t.gauge("ocor_safe_degraded_fault_active", 1.0, fault=f)
          t.gauge("ocor_recovery_reopen_authorized", 1.0 if reopened else 0.0)
          with t.lock:
              for key in list(t.gauges):
                  if key[0] == "ocor_safe_degraded_fault_active" and dict(key[1]).get("fault") not in active:
                      t.gauges[key] = 0.0


      class Handler(BaseHTTPRequestHandler):
          state: State

          def log_message(self, format: str, *args: Any) -> None:  # noqa: A002
              return

          def _send(self, code: int, body: bytes, ctype: str = "application/json") -> None:
              self.send_response(code)
              self.send_header("Content-Type", ctype)
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def _json(self, code: int, obj: Any) -> None:
              self._send(code, json.dumps(obj, sort_keys=True).encode())

          def do_GET(self) -> None:  # noqa: N802
              st = self.state
              path = self.path.split("?")[0]
              if path == "/livez":
                  self._json(200, {"status": "ALIVE", "component": COMPONENT})
              elif path == "/readyz":
                  with st.lock:
                      ready, reasons = st.readiness()
                      body = {"ready": ready, "reasons": reasons, "last_scan": iso(st.last_scan)}
                  self._json(200 if ready else 503, body)
              elif path == "/metrics":
                  self._send(200, st.telemetry.render().encode(), "text/plain; version=0.0.4")
              elif path == "/traces":
                  with st.telemetry.lock:
                      spans = list(st.telemetry.spans[-200:])
                  self._json(200, {"spans": spans})
              elif path == "/posture":
                  with st.lock:
                      self._json(200, st.posture())
              elif path == "/admit":
                  query = dict(kv.split("=", 1) for kv in self.path.partition("?")[2].split("&") if "=" in kv)
                  op = query.get("class", "")
                  correlation = self.headers.get("X-Correlation-Id") or new_id()
                  start = now()
                  with st.lock:
                      posture = st.posture()
                  if op not in OPERATION_CLASSES:
                      code, decision, reason = 400, "DENY", "UNKNOWN_OPERATION_CLASS"
                  elif op in posture["denied_operation_classes"]:
                      code, decision, reason = 503, "DENY", "SAFE_DEGRADED:" + ",".join(posture["faults"])
                  else:
                      code, decision, reason = 200, "ADMIT", "ADMITTED"
                  st.telemetry.inc("ocor_admission_decisions_total", operation_class=op if op in OPERATION_CLASSES
                                   else "unknown", decision=decision)
                  st.telemetry.span("admission", correlation, new_id(), None, start, decision, reason.split(":")[0],
                                    operation_class=op)
                  self._json(code, {"decision": decision, "reason_code": reason, "correlation_id": correlation,
                                    "stop_epoch": posture["stop_epoch"]})
              else:
                  self._json(404, {"error": "NOT_FOUND"})

          def do_POST(self) -> None:  # noqa: N802
              st = self.state
              token = os.environ.get("OCOR_OPS_OPERATOR_TOKEN", "")
              presented = self.headers.get("Authorization", "").removeprefix("Bearer ")
              correlation = self.headers.get("X-Correlation-Id") or new_id()
              if self.path not in ("/emergency-stop", "/emergency-stop/clear", "/reopen"):
                  self._json(404, {"error": "NOT_FOUND"})
                  return
              if not token or not presented or not hmac_equal(token, presented):
                  st.telemetry.inc("ocor_operator_commands_total", command=self.path.strip("/"), decision="DENY")
                  st.telemetry.log("operator_command", "OPERATOR_UNAUTHENTICATED", correlation, level="WARN")
                  self._json(401, {"error": "OPERATOR_UNAUTHENTICATED"})
                  return
              start = now()
              if self.path == "/reopen":
                  self._reopen(correlation, start)
                  return
              with st.lock:
                  if self.path == "/emergency-stop":
                      st.stop_epoch += 1
                      st.stopped_at = now()
                      reason = "EMERGENCY_STOP_ACTIVE"
                  else:
                      st.stopped_at = None
                      reason = "EMERGENCY_STOP_CLEARED_BY_HUMAN"
                  epoch = st.stop_epoch
              st.telemetry.gauge("ocor_emergency_stop_active", 1.0 if reason == "EMERGENCY_STOP_ACTIVE" else 0.0)
              st.telemetry.gauge("ocor_stop_epoch", float(epoch))
              st.telemetry.inc("ocor_operator_commands_total", command=self.path.strip("/"), decision="ACCEPT")
              st.telemetry.span("operator_command", correlation, new_id(), None, start, "OK", reason, stop_epoch=epoch)
              self._json(200, {"reason_code": reason, "stop_epoch": epoch, "correlation_id": correlation})

          def _reopen(self, correlation: str, start: float) -> None:
              """Governed reopening (ADD v1.3 6.5 step 10, LLD v1.1 5.4): a named human
              authorizes the mutative path for exactly the signed receipt that passed the
              recovery gate; any other state is refused and nothing is reopened."""
              st = self.state
              try:
                  length = int(self.headers.get("Content-Length") or 0)
                  body = json.loads(self.rfile.read(min(length, 65536)) or b"{}") if length else {}
              except ValueError:
                  body = None
              if not isinstance(body, dict):
                  body = {}
              wanted, human = body.get("receipt_digest"), body.get("authorized_by")
              with st.lock:
                  current, restore_reason = st.receipt_digest, st.restore_reason
                  if not isinstance(human, str) or not human.strip():
                      code, reason = 400, "REOPEN_REFUSED:HUMAN_AUTHORIZER_REQUIRED"
                  elif restore_reason != "RESTORE_TESTED" or current is None:
                      code, reason = 409, f"REOPEN_REFUSED:{restore_reason}"
                  elif not isinstance(wanted, str) or not hmac_equal(wanted, current):
                      code, reason = 409, "REOPEN_REFUSED:RECEIPT_MISMATCH"
                  else:
                      st.reopen = {"receipt_digest": current, "authorized_by": human.strip(),
                                   "authorized_at": iso(), "correlation_id": correlation}
                      code, reason = 200, "MUTATIVE_PATH_REOPENED_BY_HUMAN"
              decision = "ACCEPT" if code == 200 else "DENY"
              st.telemetry.inc("ocor_operator_commands_total", command="reopen", decision=decision)
              st.telemetry.span("operator_command", correlation, new_id(), None, start, "OK" if code == 200 else "DENY",
                                reason.split(":")[0], command="reopen", receipt_digest=current,
                                detail=reason.partition(":")[2] or None)
              publish_faults(st)
              self._json(code, {"reason_code": reason, "receipt_digest": current, "correlation_id": correlation})


      def hmac_equal(a: str, b: str) -> bool:
          return hmac.compare_digest(a.encode(), b.encode())


      def cmd_serve(args: argparse.Namespace) -> int:
          profile, digest = load_profile(Path(args.profile))
          telemetry = Telemetry(profile["profile"]["release"], digest)
          vault = Path(args.vault) if args.vault else None
          state = State(profile, digest, Path(args.profile), vault, telemetry)
          telemetry.gauge("ocor_emergency_stop_active", 0.0)
          telemetry.gauge("ocor_stop_epoch", 0.0)
          telemetry.log("startup", "PROFILE_VALID", new_id(), profile_digest=digest)
          interval = min(profile["observability"]["probeIntervalSeconds"],
                         profile["observability"]["driftScanIntervalSeconds"])
          # Worst-case duration of one scan (every probe timing out, egress probes, OPA and
          # OpenBao calls) plus two intervals: an older result means the scanner is stuck.
          timeout = float(profile["health"].get("probeTimeoutSeconds", 3))
          state.max_scan_age = 2 * interval + timeout * (len(profile["health"]["dependencies"]) + 2) + 2.0 * len(
              profile["isolation"]["egressDenyProbes"]) + 90.0

          def loop() -> None:
              while True:
                  try:
                      scan(state)
                  except Exception as exc:  # fail closed: never report READY or admit on scanner failure
                      with state.lock:
                          state.ready = False
                          state.ready_reasons = ["SCANNER_ERROR"]
                          state.scanner_error = type(exc).__name__
                      telemetry.inc("ocor_readiness_denials_total", reason_code="SCANNER_ERROR")
                      telemetry.log("readiness_scan", "SCANNER_ERROR", new_id(), level="ERROR",
                                    error_type=type(exc).__name__)
                      publish_faults(state)
                  time.sleep(interval)

          threading.Thread(target=loop, daemon=True).start()
          host, _, port = args.listen.rpartition(":")
          Handler.state = state
          server = ThreadingHTTPServer((host, int(port)), Handler)
          server.serve_forever()
          return 0


      # --------------------------------------------------------------------------- relay


      def relay_flow(profile: dict[str, Any], flow_host: str | None) -> dict[str, Any]:
          """The single allowed flow one relay instance serves. Each destination has its own
          relay (own address on the site network) listening only on its own port, so a
          destination name can never reach the port of another destination (ADD 6.1)."""
          host = flow_host or os.environ.get("OCOR_RELAY_FLOW_HOST", "")
          flows = [f for f in profile["isolation"]["allowedFlows"] if f["host"] == host]
          if len(flows) != 1:
              raise ConfigError(f"relay flow host {host!r} must match exactly one allowed flow")
          return dict(flows[0])


      def cmd_relay_probe(args: argparse.Namespace) -> int:
          profile, _ = load_profile(Path(args.profile))
          flow = relay_flow(profile, args.flow_host)
          socket.create_connection(("127.0.0.1", int(flow["port"])), 2).close()
          return 0


      def cmd_relay(args: argparse.Namespace) -> int:
          import asyncio

          profile, _ = load_profile(Path(args.profile))
          flows = [relay_flow(profile, args.flow_host)]

          async def pipe(reader: asyncio.StreamReader, writer: asyncio.StreamWriter) -> None:
              try:
                  while data := await reader.read(65536):
                      writer.write(data)
                      await writer.drain()
              except (OSError, asyncio.IncompleteReadError):
                  pass
              finally:
                  writer.close()

          def handler(upstream_host: str, port: int) -> Callable[[asyncio.StreamReader, asyncio.StreamWriter], Any]:
              async def handle(reader: asyncio.StreamReader, writer: asyncio.StreamWriter) -> None:
                  try:
                      ur, uw = await asyncio.wait_for(asyncio.open_connection(upstream_host, port), 5)
                  except (OSError, asyncio.TimeoutError):
                      writer.close()
                      return
                  await asyncio.gather(pipe(reader, uw), pipe(ur, writer))
              return handle

          async def main() -> None:
              servers = []
              for flow in flows:
                  upstream = args.upstream_template.format(host=flow["host"])
                  servers.append(await asyncio.start_server(handler(upstream, flow["port"]), "0.0.0.0", flow["port"]))
              sys.stdout.write(json.dumps({"component": COMPONENT, "operation": "relay_start",
                                           "reason_code": "ALLOWLIST_ACTIVE",
                                           "flows": [f"{f['host']}:{f['port']}" for f in flows]}) + "\n")
              sys.stdout.flush()
              await asyncio.gather(*(s.serve_forever() for s in servers))

          asyncio.run(main())
          return 0


      # --------------------------------------------------------------------------- backup


      def http_bytes(method: str, url: str, data: bytes | None = None, ctype: str = "application/json",
                 timeout: float = 60) -> bytes:
          req = urllib.request.Request(url, data=data, method=method, headers={"Content-Type": ctype})
          with urllib.request.urlopen(req, timeout=timeout) as resp:
              return bytes(resp.read())


      def snapshot_index(base: str, collection: str, attempts: int = 5) -> bytes:
          """Download a Qdrant snapshot that THIS seal created. Snapshot names have one-second
          resolution, so a concurrent seal (a manual run overlapping the scheduled one) can
          receive the same name and overwrite or delete the file; a download is accepted only
          when it matches the checksum returned for this creation, otherwise a new snapshot is
          taken after a jittered pause (bounded). The same collision can make the CREATION
          itself fail with a 5xx (Qdrant: "failed to store snapshot archive ... No such file"
          when the other seal moved the shared temporary file); that is retried within the same
          bound, a 4xx is not. Every created name is cleaned up; a name already removed by the
          other seal is a no-op."""
          for attempt in range(attempts):
              try:
                  created = http_bytes("POST", f"{base}/collections/{collection}/snapshots?wait=true", b"{}")
              except urllib.error.HTTPError as exc:
                  if not 500 <= exc.code < 600:
                      raise
                  time.sleep(1.0 + attempt + secrets.randbelow(1000) / 1000)  # nothing was created
                  continue
              snap = strict_json(created)
              name, checksum = snap["result"]["name"], snap["result"].get("checksum")
              data = b""
              try:
                  data = http_bytes("GET", f"{base}/collections/{collection}/snapshots/{name}")
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise
              finally:
                  try:
                      http_bytes("DELETE", f"{base}/collections/{collection}/snapshots/{name}")
                  except urllib.error.HTTPError as exc:
                      if exc.code != 404:
                          raise
              if isinstance(checksum, str) and SHA256_HEX.match(checksum) and sha256(data) == checksum:
                  return data
              time.sleep(1.0 + attempt + secrets.randbelow(1000) / 1000)  # leave the shared second
          raise ValueError("INDEX_SNAPSHOT_UNSTABLE")


      def read_csv(path: Path) -> list[dict[str, str]]:
          if not path.exists():
              return []
          with path.open(newline="") as fh:
              return list(csv.DictReader(fh))


      def ordered_deletion_journal(rows: list[dict[str, str]]) -> list[dict[str, str]]:
          """One numeric-epoch/codepoint order for seal checkpoints and replay.
          PostgreSQL capture uses COLLATE C; its database locale is never authority
          for the event-id tie break. Sorting here also canonicalizes older CSV cuts."""
          return sorted(rows, key=lambda row: (int(row["deletion_epoch"]), row["event_id"]))


      def event_ids_digest(event_ids: list[str]) -> str:
          """Digest of the WHOLE ordered tombstone sequence (ordered_deletion_journal order):
          the seal signs it in journalCheckpoints, so any omission, addition, duplicate,
          substitution or permutation of a replayed id changes it."""
          return sha256(canonical(list(event_ids)))


      def scope_row(item_id: Any, fields: dict[str, Any]) -> list[Any]:
          """Isolation scope and versions of one live memory item, in the same normal form for
          the sealed metadata row and for the restored projection payload."""
          return [str(item_id), fields.get("tenant_id"), _compartments(fields.get("compartments")),
                  fields.get("classification_marking_ref"), fields.get("governed_context_digest"),
                  str(fields.get("representation_version")), str(fields.get("lifecycle_epoch"))]


      def scope_digest(rows: list[list[Any]]) -> str:
          return sha256(canonical(sorted(rows, key=canonical)))


      def read_digests(path: Path) -> dict[str, list[str]]:
          out: dict[str, list[str]] = {}
          for line in path.read_text().splitlines():
              if line.strip():
                  name, count, digest = line.split("|")
                  out[name] = [count, digest]
          return out


      def cmd_init_keys(args: argparse.Namespace) -> int:
          profile, _ = load_profile(Path(args.profile))
          keys = profile["backup"]["keys"]
          transit_from_env(profile).ensure_keys(keys["encryption"], keys["signing"])
          sys.stdout.write(json.dumps({"component": COMPONENT, "operation": "init_keys", "reason_code": "KEYS_READY",
                                       "mount": keys["transitMount"]}) + "\n")
          return 0


      def cmd_seal(args: argparse.Namespace) -> int:
          profile, digest = load_profile(Path(args.profile))
          t = Telemetry(profile["profile"]["release"], digest)
          correlation, trace, start = new_id(), new_id(), now()
          staging, vault = Path(args.staging), Path(args.vault)
          keys = profile["backup"]["keys"]
          limits = profile["resourceLimits"]
          mem_cfg = profile["backup"]["memory"]["sources"]
          transit = transit_from_env(profile)
          deps = {d["name"]: d for d in profile["health"]["dependencies"]}
          pg_dir = staging / "postgresql"
          if not pg_dir.exists() or not list(pg_dir.glob("*.dump")):
              t.log("backup_seal", "CAPTURE_MISSING", correlation, level="ERROR")
              return EXIT_VERIFY
          artifacts: list[tuple[str, str, bytes]] = []
          store_digests: dict[str, str] = {}
          for dump in sorted(pg_dir.glob("*.dump")):
              artifacts.append(("canonical", f"postgresql/{dump.name}", dump.read_bytes()))
              artifacts.append(("audit", f"postgresql/{dump.stem}.digest", (pg_dir / f"{dump.stem}.digest").read_bytes()))
              # What a restore of this store must reproduce (bound into the receipt check).
              store_digests[dump.stem] = sha256(canonical(read_digests(pg_dir / f"{dump.stem}.digest")))
          kafka = staging / "kafka" / "offsets.txt"
          if not kafka.exists():
              t.log("backup_seal", "EVENT_CHECKPOINT_MISSING", correlation, level="ERROR")
              return EXIT_VERIFY
          artifacts.append(("event", "kafka/offsets.txt", kafka.read_bytes()))
          # Memory metadata, deletion journal and index snapshot at the same cut (Part II 2.13).
          items = read_csv(pg_dir / "memory-items.csv")
          journal = ordered_deletion_journal(read_csv(pg_dir / "memory-deletion-journal.csv"))
          q = deps["qdrant"]
          base = f"http://{q['host']}:{q['port']}"
          collection = mem_cfg["indexCollection"]
          index_bytes = b""
          memory_present = (pg_dir / "memory-items.csv").exists()
          if memory_present:
              if len(items) > limits["itemCount"]:
                  t.inc("ocor_backup_runs_total", outcome="backpressure")
                  t.log("backup_seal", "QUOTA_BACKPRESSURE", correlation, level="WARN", limit="itemCount",
                        observed=len(items), semantic_downgrade=False)
                  return EXIT_BACKPRESSURE
              info = json.loads(http_bytes("GET", f"{base}/collections/{collection}"))["result"]
              dims = int(info["config"]["params"]["vectors"]["size"])
              if dims > limits["embeddingDimensions"]:
                  t.inc("ocor_backup_runs_total", outcome="backpressure")
                  t.log("backup_seal", "QUOTA_BACKPRESSURE", correlation, level="WARN", limit="embeddingDimensions",
                        observed=dims, semantic_downgrade=False)
                  return EXIT_BACKPRESSURE
              try:
                  index_bytes = snapshot_index(base, collection)
              except ValueError as exc:
                  t.inc("ocor_backup_runs_total", outcome="failed")
                  t.log("backup_seal", str(exc), correlation, level="ERROR")
                  return EXIT_VERIFY
              if len(index_bytes) > limits["indexSizeBytes"]:
                  t.inc("ocor_backup_runs_total", outcome="backpressure")
                  t.log("backup_seal", "QUOTA_BACKPRESSURE", correlation, level="WARN", limit="indexSizeBytes",
                        observed=len(index_bytes), semantic_downgrade=False)
                  return EXIT_BACKPRESSURE
              artifacts.append(("projection", f"qdrant/{collection}.snapshot", index_bytes))
              artifacts.append(("canonical", "memory/memory-items.csv", (pg_dir / "memory-items.csv").read_bytes()))
              artifacts.append(("audit", "memory/memory-deletion-journal.csv",
                                (pg_dir / "memory-deletion-journal.csv").read_bytes()))
          o = deps["opa"]
          status, _ = http_status(o["host"], o["port"], "/health", 5)
          policies = http_bytes("GET", f"http://{o['host']}:{o['port']}/v1/policies")
          artifacts.append(("governance", "opa/policies.json", policies))
          artifacts.append(("definition", "profile/profile.json", Path(args.profile).read_bytes()))
          artifacts.append(("key_custody", "keys/public-keys.json",
                            canonical({"signing": transit.public_key(keys["signing"]),
                                       "encryption_key": keys["encryption"], "mount": keys["transitMount"],
                                       "escrow": "OpenBao transit; key material never leaves the key custodian"})))
          created = now()
          rp_id = time.strftime("rp-%Y%m%dT%H%M%SZ-", time.gmtime(created)) + new_id()[:8]
          rp_dir = vault / "recovery-points" / rp_id
          entries: list[dict[str, Any]] = []
          for cls, name, data in artifacts:
              chunks = transit.encrypt(keys["encryption"], data)
              blob = canonical({"chunks": chunks, "key": keys["encryption"]})
              cdigest = sha256(blob)
              write_immutable(rp_dir / "objects" / f"{cdigest}.enc", blob)
              entries.append({"authority_class": cls, "name": name, "plaintext_sha256": sha256(data),
                              "ciphertext_sha256": cdigest, "bytes": len(data)})
          journal_max = max((int(r["deletion_epoch"]) for r in journal), default=0)
          metadata_max = max((int(r["deletion_epoch"]) for r in items if r.get("deletion_epoch")), default=0)
          live = [r for r in items if r["lifecycle_state"] != "deleted"]
          manifest = {
              "schema": MANIFEST_SCHEMA,
              "recovery_point": rp_id, "created_at": iso(created), "created_at_epoch": created,
              "profile_digest": digest, "release": profile["profile"]["release"],
              "rpo_minutes": profile["backup"]["rpoMinutes"],
              "encryption": {"mount": keys["transitMount"], "key": keys["encryption"], "algorithm": "aes256-gcm96"},
              "signature": {"key": keys["signing"], "algorithm": "ed25519"},
              "artifacts": entries,
              "store_digests": store_digests,
              "authority_classes_present": sorted({str(e["authority_class"]) for e in entries}),
              "authority_classes_without_store": {
                  cls: "NO_STORE_DEPLOYED_AT_G4" for cls in sorted(
                      set(profile["backup"]["authorityClasses"]) - {str(e["authority_class"]) for e in entries})},
              "memory": {
                  "status": "PRESENT" if memory_present else "NO_MEMORY_STORE_PRESENT",
                  "metadataRef": "memory/memory-items.csv" if memory_present else None,
                  "contentRefs": sorted({r["content_ref"] for r in items}),
                  "representationVersions": sorted({int(r["representation_version"]) for r in items}),
                  "lifecycleEpochs": sorted({int(r["lifecycle_epoch"]) for r in items}),
                  "deletionEpochs": {"journal_max": journal_max, "metadata_max": metadata_max},
                  "journalCheckpoints": {"entries": len(journal), "max_deletion_epoch": journal_max,
                                         "last_event_id": journal[-1]["event_id"] if journal else None,
                                         "event_ids_digest": event_ids_digest([r["event_id"] for r in journal])},
                  # The live projection a restore of this point must reproduce, item by item.
                  "liveItems": {"count": len(live),
                                "ids_digest": sha256(canonical(sorted(r["item_id"] for r in live))),
                                "scope_digest": scope_digest([scope_row(r["item_id"], r) for r in live])},
                  "auditRefs": [e["ciphertext_sha256"] for e in entries if e["authority_class"] == "audit"],
                  "indexCollection": collection if memory_present else None,
                  "boundToSameRecoveryPoint": True,
              },
              "replay_pins": {
                  "policy_digest": sha256(policies), "event_schema": sha256(kafka.read_bytes()),
                  "ordering": "deletion_epoch,event_id", "seed": profile["restore"]["replay"].get("seed"),
                  "ontology_release": None, "compiler_logic_bundle": None, "canonical_commit": None,
                  "model_digest": None, "assumptions": None,
                  "unpinned_reason": "ontology/compiler/model/canonical-commit authorities are not deployed at G4",
              },
              "image_pins": profile["images"]["pins"],
              "opa_health_status": status,
          }
          raw = canonical(manifest)
          write_immutable(rp_dir / "manifest.json", raw)
          write_immutable(rp_dir / "manifest.sig", transit.sign(keys["signing"], raw).encode())
          os.chmod(rp_dir / "objects", 0o555)
          os.chmod(rp_dir, 0o555)
          erase_tree(staging)
          t.inc("ocor_backup_runs_total", outcome="sealed")
          t.span("backup_seal", correlation, trace, None, start, "OK", "RECOVERY_POINT_SEALED",
                 recovery_point=rp_id, artifacts=len(entries), bytes=sum(e["bytes"] for e in entries))
          sys.stdout.write(json.dumps({"recovery_point": rp_id, "manifest_sha256": sha256(raw)}) + "\n")
          return 0


      # --------------------------------------------------------------------------- restore


      def select_recovery_point(vault: Path, wanted: str | None) -> Path:
          points = recovery_points(vault)
          if wanted:
              points = [p for p in points if p.name == wanted]
          if not points:
              raise ValueError("NO_RECOVERY_POINT")
          return points[-1]


      def cmd_restore_prepare(args: argparse.Namespace) -> int:
          profile, digest = load_profile(Path(args.profile))
          t = Telemetry(profile["profile"]["release"], digest)
          correlation, trace, start = new_id(), new_id(), now()
          vault, out = Path(args.vault), Path(args.staging)
          transit = transit_from_env(profile)
          try:
              rp_dir = select_recovery_point(vault, args.recovery_point)
              manifest = verify_manifest(transit, profile, rp_dir)
              # Compatibility before restore (FR-156; ADD v1.3 6.5 step 4 restores the
              # pinned release): a recovery point of another release/profile/pin set is
              # not restored under this one.
              mismatch = binding_mismatch(manifest_binding(manifest), profile, digest)
              if mismatch is not None:
                  raise ValueError(mismatch)
              for entry in manifest["artifacts"]:
                  blob = (rp_dir / "objects" / f"{entry['ciphertext_sha256']}.enc").read_bytes()
                  if sha256(blob) != entry["ciphertext_sha256"]:
                      raise ValueError("CIPHERTEXT_DIGEST_MISMATCH")
                  data = transit.decrypt(manifest["encryption"]["key"], strict_json(blob)["chunks"])
                  if sha256(data) != entry["plaintext_sha256"]:
                      raise ValueError("PLAINTEXT_DIGEST_MISMATCH")
                  target = out / entry["name"]
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          except (ValueError, OSError, KeyError) as exc:
              reason = str(exc) if isinstance(exc, ValueError) else f"VERIFY_ERROR:{type(exc).__name__}"
              t.inc("ocor_restore_runs_total", outcome="rejected")
              t.span("restore_prepare", correlation, trace, None, start, "ERROR", reason.split(":")[0])
              sys.stderr.write(json.dumps({"reason_code": reason}) + "\n")
              return EXIT_VERIFY
          (out / "manifest.json").write_bytes(canonical(manifest))
          t.span("restore_prepare", correlation, trace, None, start, "OK", "RECOVERY_POINT_VERIFIED",
                 recovery_point=rp_dir.name)
          sys.stdout.write(json.dumps({"recovery_point": rp_dir.name, "reason_code": "RECOVERY_POINT_VERIFIED"}) + "\n")
          return 0


      def _points(base: str, collection: str) -> list[dict[str, Any]]:
          out: list[dict[str, Any]] = []
          offset: Any = None
          while True:
              body: dict[str, Any] = {"limit": 256, "with_payload": True, "with_vector": False}
              if offset is not None:
                  body["offset"] = offset
              res = json.loads(http_bytes("POST", f"{base}/collections/{collection}/points/scroll", canonical(body)))["result"]
              out.extend(res["points"])
              offset = res.get("next_page_offset")
              if offset is None:
                  return out


      def _multipart(name: str, data: bytes) -> tuple[bytes, str]:
          boundary = "ocor" + new_id()
          head = (f"--{boundary}\r\nContent-Disposition: form-data; name=\"snapshot\"; filename=\"{name}\"\r\n"
                  "Content-Type: application/octet-stream\r\n\r\n").encode()
          return head + data + f"\r\n--{boundary}--\r\n".encode(), f"multipart/form-data; boundary={boundary}"


      def _uuid_for(item_id: str) -> str:
          return str(uuid.uuid5(uuid.NAMESPACE_URL, f"ocor-memory:{item_id}"))


      def _compartments(value: Any) -> list[str] | None:
          """Canonical compartment set (ADD v1.3 3.0: set equivalence after canonical sort);
          None when the value is missing, ambiguous or not a set of non-empty strings."""
          if isinstance(value, str):
              try:
                  value = json.loads(value)
              except ValueError:
                  return None
          if not isinstance(value, list) or not value or not all(isinstance(c, str) and c for c in value):
              return None
          if len(set(value)) != len(value):
              return None
          return sorted(value)


      def scope_violations(payload: dict[str, Any], meta: dict[str, str]) -> dict[str, list[str]]:
          """Compare one restored projection item with its authoritative metadata row.
          Every field is fail-closed: missing, malformed or different is a violation."""
          out: dict[str, list[str]] = {"tenant": [], "compartments": [], "marking": [], "gcs": [], "version": []}
          tenant = meta.get("tenant_id") or ""
          if not tenant or payload.get("tenant_id") != tenant:
              out["tenant"].append("tenant_id")
          expected = _compartments(meta.get("compartments"))
          if expected is None or _compartments(payload.get("compartments")) != expected:
              out["compartments"].append("compartments")
          marking = meta.get("classification_marking_ref") or ""
          if not CONTRACT_DIGEST.match(marking) or payload.get("classification_marking_ref") != marking:
              out["marking"].append("classification_marking_ref")
          gcs = meta.get("governed_context_digest") or ""
          if not CONTRACT_DIGEST.match(gcs) or payload.get("governed_context_digest") != gcs:
              out["gcs"].append("governed_context_digest")
          for key in ("representation_version", "lifecycle_epoch"):
              if str(payload.get(key)) != str(meta.get(key)):
                  out["version"].append(key)
          return out


      def cmd_restore_finalize(args: argparse.Namespace) -> int:
          profile, digest = load_profile(Path(args.profile))
          t = Telemetry(profile["profile"]["release"], digest)
          correlation, trace, start = new_id(), new_id(), now()
          staging, vault = Path(args.staging), Path(args.vault)
          keys = profile["backup"]["keys"]
          transit = transit_from_env(profile)
          manifest = strict_json((staging / "manifest.json").read_bytes())
          gate: dict[str, dict[str, Any]] = {}
          steps: list[dict[str, str]] = []

          def step(name: str, status: str, detail: str) -> None:
              steps.append({"step": name, "status": status, "detail": detail})

          step(RESTORE_STEPS[0], "EXECUTED", "restore runs on an isolated network; mutative path closed until receipt")
          step(RESTORE_STEPS[1], "EXECUTED", manifest["recovery_point"])
          step(RESTORE_STEPS[2], "EXECUTED", "manifest ed25519 signature and per-object digests verified (single custodian)")
          step(RESTORE_STEPS[3], "EXECUTED", "profile, OPA policies and key references restored from manifest")
          # Canonical/audit stores: digests of the isolated PostgreSQL after pg_restore.
          revision_ok, digest_ok, detail = True, True, []
          restored_store_digests: dict[str, str] = {}
          for entry in manifest["artifacts"]:
              if entry["name"].endswith(".digest"):
                  db = Path(entry["name"]).stem
                  expected = read_digests(staging / entry["name"])
                  restored_path = staging / "restored" / f"{db}.digest"
                  if not restored_path.exists():
                      revision_ok = digest_ok = False
                      detail.append(f"{db}:not_restored")
                      continue
                  restored = read_digests(restored_path)
                  restored_store_digests[db] = sha256(canonical(restored))
                  if {k: v[0] for k, v in expected.items()} != {k: v[0] for k, v in restored.items()}:
                      revision_ok = False
                      detail.append(f"{db}:row_counts_differ")
                  if expected != restored:
                      digest_ok = False
                      detail.append(f"{db}:semantic_digest_differs")
          step(RESTORE_STEPS[4], "EXECUTED" if revision_ok else "FAILED", ",".join(detail) or "same cut restored")
          gate["revision"] = {"pass": revision_ok, "detail": detail}
          gate["sample_semantic_digest"] = {"pass": digest_ok, "detail": detail}

          mem = manifest["memory"]
          base = f"http://{args.restore_qdrant}"
          replayed: list[str] = []
          replay_digest = restored_scope_digest = None
          if mem["status"] == "PRESENT":
              collection = mem["indexCollection"]
              snap = (staging / "qdrant" / f"{collection}.snapshot").read_bytes()
              body, ctype = _multipart(f"{collection}.snapshot", snap)
              http_bytes("POST", f"{base}/collections/{collection}/snapshots/upload?priority=snapshot&wait=true",
                     body, ctype, timeout=120)
              items = read_csv(staging / "memory" / "memory-items.csv")
              journal = ordered_deletion_journal(read_csv(staging / "memory" / "memory-deletion-journal.csv"))
              # Replay tombstones BEFORE retrieval reopens, with original event ids, no external effects.
              for tomb in journal:
                  http_bytes("POST", f"{base}/collections/{collection}/points/delete?wait=true",
                         canonical({"points": [_uuid_for(tomb["item_id"])]}))
                  replayed.append(tomb["event_id"])
              step(RESTORE_STEPS[5], "EXECUTED", f"{len(replayed)} tombstones replayed with original event ids")
              points = _points(base, collection)
              present = [str(pt["payload"].get("item_id")) for pt in points]
              deleted_meta = {r["item_id"] for r in items if r["lifecycle_state"] == "deleted"}
              tombstoned = {r["item_id"] for r in journal}
              live_meta = {r["item_id"] for r in items if r["lifecycle_state"] != "deleted"}
              resurrected = sorted((deleted_meta | tombstoned) & set(present))
              journal_max = max((int(r["deletion_epoch"]) for r in journal), default=0)
              meta_max = max((int(r["deletion_epoch"]) for r in items if r.get("deletion_epoch")), default=0)
              stale = journal_max < meta_max or journal_max != mem["journalCheckpoints"]["max_deletion_epoch"]
              orphans = sorted(set(present) - live_meta - deleted_meta)
              dupes = sorted({x for x in present if present.count(x) > 1})
              # Per-item isolation scope of the restored projection against the authoritative
              # metadata: tenant, compartments, marking and GCS binding (LLD 5.4 recovery gate).
              meta_by_id = {r["item_id"]: r for r in items}
              violations: dict[str, dict[str, list[str]]] = {}
              for pt in points:
                  payload = pt.get("payload") or {}
                  row = meta_by_id.get(str(payload.get("item_id")))
                  if row is not None:
                      found = {k: v for k, v in scope_violations(payload, row).items() if v}
                      if found:
                          violations[str(payload.get("item_id"))] = found
              def failing(*kinds: str) -> list[str]:
                  return sorted(i for i, v in violations.items() if any(k in v for k in kinds))
              gate["deletion_resurrection"] = {"pass": not resurrected, "detail": resurrected}
              gate["projection_drift_or_stale_deletion_epoch"] = {
                  "pass": not stale and set(present) == live_meta and not failing("version"),
                  "detail": {"journal_max": journal_max, "metadata_max": meta_max,
                             "missing_live": sorted(live_meta - set(present)),
                             "version_drift": failing("version")}}
              gate["orphan_duplicate"] = {"pass": not orphans and not dupes, "detail": {"orphans": orphans, "dupes": dupes}}
              gate["marking"] = {"pass": not failing("marking"), "detail": {"marking_mismatch": failing("marking")}}
              gate["gcs"] = {"pass": not failing("tenant", "compartments", "gcs"),
                             "detail": {"tenant_mismatch": failing("tenant"),
                                        "compartment_mismatch": failing("compartments"),
                                        "gcs_digest_mismatch": failing("gcs")}}
              quarantined = sorted(violations)
              gate["watermark"] = {"pass": len(present) == len(live_meta),
                                   "detail": {"index_items": len(present), "live_metadata_items": len(live_meta)}}
              replay_digest = sha256(canonical(sorted(present)))
              restored_scope_digest = scope_digest([scope_row(pt["payload"].get("item_id"), pt["payload"])
                                                    for pt in points])
          else:
              quarantined = []
              step(RESTORE_STEPS[5], "NOT_APPLICABLE", "no memory store present in this recovery point")
              for name in ("deletion_resurrection", "projection_drift_or_stale_deletion_epoch", "orphan_duplicate",
                           "marking", "gcs", "watermark"):
                  gate[name] = {"pass": True, "detail": "no memory store present"}
          step(RESTORE_STEPS[6], "NOT_EXECUTED", "LogicProjection/W3CBoundary rebuild belongs to C4 qualification")
          step(RESTORE_STEPS[7], "EXECUTED", "kafka offsets checkpoint and outbox tables verified by digest")
          step(RESTORE_STEPS[8], "NOT_APPLICABLE", "no external effects in flight in the drill")
          step(RESTORE_STEPS[9], "NOT_EXECUTED", "mission-thread replay is a G6 qualification, not claimed here")
          passed = all(g["pass"] for g in gate.values())
          step(RESTORE_STEPS[10], "PENDING_HUMAN_AUTHORIZATION" if passed else "BLOCKED",
               "retrieval/mutative reopening requires human authorization")
          completed = now()
          receipt = {
              "schema": RECEIPT_SCHEMA, "recovery_point": manifest["recovery_point"],
              "release_binding": release_binding(profile, digest),
              "manifest_digest": sha256(canonical(manifest)), "outcome": "PASSED" if passed else "FAILED",
              "recovery_gate": {name: gate[name] for name in RECOVERY_GATE}, "steps": steps,
              "replayed_event_ids": replayed, "replay_digest": replay_digest, "quarantined_items": quarantined,
              "restored_scope_digest": restored_scope_digest, "restored_store_digests": restored_store_digests,
              "retrieval_reopened": False, "materialisation": "ALLOWED_PENDING_HUMAN" if passed else "BLOCKED",
              "isolated_network": True, "completed_at": iso(completed), "completed_at_epoch": completed,
              "duration_seconds": round(completed - start, 3), "rto_hours_target": profile["backup"]["rtoHours"],
              "correlation_id": correlation,
          }
          raw = canonical(receipt)
          name = time.strftime("%Y%m%dT%H%M%SZ-", time.gmtime(completed)) + new_id()[:8]
          write_immutable(vault / "restore-receipts" / f"{name}.json", raw)
          write_immutable(vault / "restore-receipts" / f"{name}.sig", transit.sign(keys["signing"], raw).encode())
          erase_tree(staging)
          t.inc("ocor_restore_runs_total", outcome=receipt["outcome"].lower())
          failed = [n for n in RECOVERY_GATE if not gate[n]["pass"]]
          t.span("restore_finalize", correlation, trace, None, start, "OK" if passed else "ERROR",
                 "RECOVERY_GATE_PASSED" if passed else "RECOVERY_GATE_FAILED", failed_checks=failed,
                 recovery_point=manifest["recovery_point"])
          sys.stdout.write(json.dumps({"receipt": name, "outcome": receipt["outcome"], "failed": failed,
                                       "replay_digest": replay_digest}) + "\n")
          return 0 if passed else EXIT_GATE


      # --------------------------------------------------------------------------- main


      def main(argv: list[str] | None = None) -> int:
          parser = argparse.ArgumentParser(prog="ocor-ops")
          sub = parser.add_subparsers(dest="command", required=True)
          for name in ("validate", "serve", "relay", "relay-probe", "init-keys", "seal", "restore-prepare",
                       "restore-finalize"):
              sp = sub.add_parser(name)
              sp.add_argument("--profile", required=True)
              if name == "serve":
                  sp.add_argument("--listen", default="0.0.0.0:8080")
                  sp.add_argument("--vault")
              if name == "relay":
                  sp.add_argument("--upstream-template", default="{host}")
              if name in ("relay", "relay-probe"):
                  sp.add_argument("--flow-host")
              if name in ("seal", "restore-prepare", "restore-finalize"):
                  sp.add_argument("--vault", required=True)
                  sp.add_argument("--staging", required=True)
              if name == "restore-prepare":
                  sp.add_argument("--recovery-point")
              if name == "restore-finalize":
                  sp.add_argument("--restore-qdrant", required=True)
          args = parser.parse_args(argv)
          handlers: dict[str, Callable[[argparse.Namespace], int]] = {
              "serve": cmd_serve, "relay": cmd_relay, "relay-probe": cmd_relay_probe, "init-keys": cmd_init_keys,
              "seal": cmd_seal,
              "restore-prepare": cmd_restore_prepare, "restore-finalize": cmd_restore_finalize,
          }
          try:
              if args.command == "validate":
                  load_profile(Path(args.profile))
                  sys.stdout.write(json.dumps({"reason_code": "PROFILE_VALID"}) + "\n")
                  return 0
              return handlers[args.command](args)
          except ConfigError as exc:
              sys.stderr.write(json.dumps({"component": COMPONENT, "reason_code": "PROFILE_INVALID",
                                           "errors": str(exc).split("; ")}) + "\n")
              return EXIT_CONFIG


      if __name__ == "__main__":
          sys.exit(main())
