# OCOR PoC single-site profile — Compose carrier (ADD v1.3 §6, Part II §2.13; LLD v1.1 §5).
# Standalone project attached to the running ocor-bootstrap stack. Usage:
#   docker compose -p ocor-poc -f deploy/helm/ocor-poc/compose.profiles.yaml \
#     --env-file <bootstrap env> --profile <observability|safe-degraded|backup|restore-drill|full> up
# Required environment: OCOR_LOCAL_OPENBAO_TOKEN, OCOR_LOCAL_POSTGRES_PASSWORD,
# OCOR_OPS_OPERATOR_TOKEN and OCOR_BACKUP_VAULT_DIR (a host directory outside the
# project, so the vault survives `down -v` of the workload fault domain).
#
# Network posture (ADD §6.1 default-deny): every profile workload sits on the
# `site` network, which is `internal` (no route outside the host bridge). The
# only paths to the foundation services are the `ocor-relay-<host>` instances,
# one per entry of `isolation.allowedFlows`: each owns the alias of its
# destination on `site` and listens only on that destination's port, so every
# destination/port pair outside the allowlist is refused. Restore drills run on
# a second internal network, `restore`, with ephemeral stores only.
#
# `configs.ocor-ops-agent` is the single source of the ops agent program that
# the Helm chart also mounts (templates/configmap.yaml reads it from this file).
name: ocor-poc

x-ops: &ops
  image: python:3.11@sha256:c7220863385ee39fb6d822da81f4469d0cd33ff893d92ce94105e5c3f4b95fe2
  init: true
  restart: "no"
  user: "${OCOR_OPS_UID:-1000}:${OCOR_OPS_GID:-1000}"
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  tmpfs: ["/tmp"]
  configs:
    - {source: ocor-ops-agent, target: /opt/ocor/ocor_ops_agent.py}
    - {source: ocor-poc-profile, target: /etc/ocor/profile.json}
  environment:
    OCOR_OPENBAO_TOKEN: ${OCOR_LOCAL_OPENBAO_TOKEN:?required}
    OCOR_OPS_OPERATOR_TOKEN: ${OCOR_OPS_OPERATOR_TOKEN:?required}
    PYTHONDONTWRITEBYTECODE: "1"
  networks: [site]
  depends_on: &relays
    ocor-relay-terminusdb: {condition: service_healthy}
    ocor-relay-typedb: {condition: service_healthy}
    ocor-relay-fuseki: {condition: service_healthy}
    ocor-relay-opa: {condition: service_healthy}
    ocor-relay-keycloak: {condition: service_healthy}
    ocor-relay-openbao: {condition: service_healthy}
    ocor-relay-postgresql: {condition: service_healthy}
    ocor-relay-kafka: {condition: service_healthy}
    ocor-relay-qdrant: {condition: service_healthy}
    ocor-relay-spire-server: {condition: service_healthy}

x-relay: &relay
  image: python:3.11@sha256:c7220863385ee39fb6d822da81f4469d0cd33ff893d92ce94105e5c3f4b95fe2
  profiles: [observability, safe-degraded, backup, restore-drill, full]
  init: true
  restart: "no"
  user: "${OCOR_OPS_UID:-1000}:${OCOR_OPS_GID:-1000}"
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  configs:
    - {source: ocor-ops-agent, target: /opt/ocor/ocor_ops_agent.py}
    - {source: ocor-poc-profile, target: /etc/ocor/profile.json}
  command: [python3, /opt/ocor/ocor_ops_agent.py, relay, --profile, /etc/ocor/profile.json,
            --upstream-template, "${OCOR_BOOTSTRAP_PROJECT:-ocor-bootstrap}-{host}-1"]
  healthcheck:
    test: [CMD, python3, /opt/ocor/ocor_ops_agent.py, relay-probe, --profile, /etc/ocor/profile.json]
    interval: 2s
    timeout: 3s
    retries: 15

services:
  # One relay per allowed flow; the alias on `site` is the destination name.
  ocor-relay-terminusdb:
    <<: *relay
    environment: {OCOR_RELAY_FLOW_HOST: terminusdb}
    networks: {bootstrap: {}, site: {aliases: [terminusdb]}}
  ocor-relay-typedb:
    <<: *relay
    environment: {OCOR_RELAY_FLOW_HOST: typedb}
    networks: {bootstrap: {}, site: {aliases: [typedb]}}
  ocor-relay-fuseki:
    <<: *relay
    environment: {OCOR_RELAY_FLOW_HOST: fuseki}
    networks: {bootstrap: {}, site: {aliases: [fuseki]}}
  ocor-relay-opa:
    <<: *relay
    environment: {OCOR_RELAY_FLOW_HOST: opa}
    networks: {bootstrap: {}, site: {aliases: [opa]}}
  ocor-relay-keycloak:
    <<: *relay
    environment: {OCOR_RELAY_FLOW_HOST: keycloak}
    networks: {bootstrap: {}, site: {aliases: [keycloak]}}
  ocor-relay-openbao:
    <<: *relay
    environment: {OCOR_RELAY_FLOW_HOST: openbao}
    networks: {bootstrap: {}, site: {aliases: [openbao]}}
  ocor-relay-postgresql:
    <<: *relay
    environment: {OCOR_RELAY_FLOW_HOST: postgresql}
    networks: {bootstrap: {}, site: {aliases: [postgresql]}}
  ocor-relay-kafka:
    <<: *relay
    environment: {OCOR_RELAY_FLOW_HOST: kafka}
    networks: {bootstrap: {}, site: {aliases: [kafka]}}
  ocor-relay-qdrant:
    <<: *relay
    environment: {OCOR_RELAY_FLOW_HOST: qdrant}
    networks: {bootstrap: {}, site: {aliases: [qdrant]}}
  ocor-relay-spire-server:
    <<: *relay
    environment: {OCOR_RELAY_FLOW_HOST: spire-server}
    networks: {bootstrap: {}, site: {aliases: [spire-server]}}

  ocor-ops:
    <<: *ops
    profiles: [observability, safe-degraded, full]
    command: [python3, /opt/ocor/ocor_ops_agent.py, serve, --profile, /etc/ocor/profile.json,
              --listen, "0.0.0.0:8080", --vault, /vault]
    volumes:
      - "${OCOR_BACKUP_VAULT_DIR:?required}:/vault:ro"
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  ocor-keys-init:
    <<: *ops
    profiles: [backup, full]
    command: [python3, /opt/ocor/ocor_ops_agent.py, init-keys, --profile, /etc/ocor/profile.json]

  ocor-staging-init:
    image: python:3.11@sha256:c7220863385ee39fb6d822da81f4469d0cd33ff893d92ce94105e5c3f4b95fe2
    profiles: [backup, restore-drill, full]
    restart: "no"
    user: "0:0"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    network_mode: none
    volumes: ["backup-staging:/staging", "restore-staging:/restore"]
    command: [python3, -c, "import os; [(os.chmod(p, 0o700), os.chown(p, ${OCOR_OPS_UID:-1000}, ${OCOR_OPS_GID:-1000})) for p in ('/staging', '/restore')]"]

  ocor-backup-capture-postgresql:
    image: postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    profiles: [backup, full]
    restart: "no"
    user: "${OCOR_OPS_UID:-1000}:${OCOR_OPS_GID:-1000}"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [site]
    depends_on:
      <<: *relays
      ocor-staging-init: {condition: service_completed_successfully}
    configs:
      - {source: ocor-table-digest, target: /opt/ocor/table-digest.sql}
    environment:
      PGHOST: postgresql
      PGUSER: ocor
      PGPASSWORD: ${OCOR_LOCAL_POSTGRES_PASSWORD:?required}
      MEMORY_DB: ocor_poc_drill
    volumes: ["backup-staging:/staging"]
    entrypoint: [sh, -ec]
    command:
      - |
        out=/staging/postgresql; rm -rf "$$out"; mkdir -p "$$out"
        # Bounded wait for the database path (the network policy of a new pod can be
        # programmed asynchronously); an unreachable database fails the capture explicitly.
        attempts=$${OCOR_CAPTURE_WAIT_ATTEMPTS:-30}; n=0
        until pg_isready -d ocor -t 2 >/dev/null; do
          n=$$((n + 1))
          [ "$$n" -lt "$$attempts" ] || { echo "CAPTURE_SOURCE_UNREACHABLE: postgresql after $$n attempts" >&2; exit 1; }
          sleep 2
        done
        # Plain assignments, not a for-list or a pipeline: a failed query aborts under sh -e
        # instead of yielding an empty capture or a silently skipped memory store.
        dbs=$$(psql -d ocor -Atc "select datname from pg_database where not datistemplate and datallowconn order by 1")
        [ -n "$$dbs" ] || { echo "CAPTURE_EMPTY: no database listed" >&2; exit 1; }
        for db in $$dbs; do
          pg_dump -d "$$db" -Fc -f "$$out/$$db.dump"
          psql -d "$$db" -At -f /opt/ocor/table-digest.sql > "$$out/$$db.digest"
        done
        memory=$$(psql -d ocor -Atc "select count(*) from pg_database where datname='$$MEMORY_DB'")
        if [ "$$memory" = 1 ]; then
          psql -d "$$MEMORY_DB" -c "\copy (select item_id, tenant_id, compartments, representation_version, lifecycle_epoch, lifecycle_state, coalesce(deletion_epoch::text, '') as deletion_epoch, content_ref, classification_marking_ref, governed_context_digest from memory_item order by item_id) to '$$out/memory-items.csv' csv header"
          psql -d "$$MEMORY_DB" -c "\copy (select event_id, item_id, deletion_epoch from memory_deletion_journal order by deletion_epoch, event_id collate \"C\") to '$$out/memory-deletion-journal.csv' csv header"
        fi
        ls -l "$$out"

  ocor-backup-capture-kafka:
    image: confluentinc/cp-kafka@sha256:24cdd3a7fa89d2bed150560ebea81ff1943badfa61e51d66bb541a6b0d7fb047
    profiles: [backup, full]
    restart: "no"
    user: "${OCOR_OPS_UID:-1000}:${OCOR_OPS_GID:-1000}"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [site]
    depends_on:
      <<: *relays
      ocor-staging-init: {condition: service_completed_successfully}
    volumes: ["backup-staging:/staging"]
    entrypoint: [sh, -ec]
    command:
      - |
        mkdir -p /staging/kafka
        topics=$$(kafka-topics --bootstrap-server kafka:29092 --list --exclude-internal)
        if [ -n "$$topics" ]; then
          kafka-get-offsets --bootstrap-server kafka:29092 --exclude-internal-topics > /staging/kafka/offsets.txt
        else
          echo "# event journal checkpoint: no topics at this cut" > /staging/kafka/offsets.txt
        fi
        wc -l /staging/kafka/offsets.txt

  ocor-backup-seal:
    <<: *ops
    profiles: [backup, full]
    depends_on:
      <<: *relays
      ocor-keys-init: {condition: service_completed_successfully}
      ocor-backup-capture-postgresql: {condition: service_completed_successfully}
      ocor-backup-capture-kafka: {condition: service_completed_successfully}
    command: [python3, /opt/ocor/ocor_ops_agent.py, seal, --profile, /etc/ocor/profile.json,
              --vault, /vault, --staging, /staging]
    volumes:
      - "${OCOR_BACKUP_VAULT_DIR:?required}:/vault"
      - "backup-staging:/staging"

  ocor-restore-prepare:
    <<: *ops
    profiles: [restore-drill]
    depends_on:
      <<: *relays
      ocor-staging-init: {condition: service_completed_successfully}
    command: [python3, /opt/ocor/ocor_ops_agent.py, restore-prepare, --profile, /etc/ocor/profile.json,
              --vault, /vault, --staging, /restore]
    volumes:
      - "${OCOR_BACKUP_VAULT_DIR:?required}:/vault:ro"
      - "restore-staging:/restore"

  ocor-restore-postgresql:
    image: postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    profiles: [restore-drill]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    networks: [restore]
    environment:
      POSTGRES_DB: ocor
      POSTGRES_USER: ocor
      # Ephemeral store reachable only on the internal `restore` network.
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs: ["/var/lib/postgresql/data:size=512m,mode=0700"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ocor -d ocor"]
      interval: 2s
      timeout: 2s
      retries: 30

  ocor-restore-qdrant:
    image: qdrant/qdrant@sha256:d122138f76868edba68d36cb0833139c1d1761f00f09e48e61f8314196e6a4c6
    profiles: [restore-drill]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    networks: [restore]
    tmpfs: ["/qdrant/storage:size=512m,mode=0750", "/qdrant/snapshots:size=256m,mode=0750"]
    healthcheck:
      test: [CMD-SHELL, "grep -qi ':18BD ' /proc/net/tcp"]
      interval: 2s
      timeout: 2s
      retries: 30

  ocor-restore-load-postgresql:
    image: postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    profiles: [restore-drill]
    restart: "no"
    user: "${OCOR_OPS_UID:-1000}:${OCOR_OPS_GID:-1000}"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [restore]
    depends_on:
      ocor-restore-prepare: {condition: service_completed_successfully}
      ocor-restore-postgresql: {condition: service_healthy}
    configs:
      - {source: ocor-table-digest, target: /opt/ocor/table-digest.sql}
    environment:
      PGHOST: ocor-restore-postgresql
      PGUSER: ocor
    volumes: ["restore-staging:/restore"]
    entrypoint: [sh, -ec]
    command:
      - |
        mkdir -p /restore/restored
        for f in /restore/postgresql/*.dump; do
          db=$$(basename "$$f" .dump)
          dropdb --maintenance-db=template1 --if-exists --force "$$db"
          createdb --maintenance-db=template1 "$$db"
          pg_restore --no-owner --no-privileges --exit-on-error -d "$$db" "$$f"
          psql -d "$$db" -At -f /opt/ocor/table-digest.sql > "/restore/restored/$$db.digest"
        done
        ls -l /restore/restored

  ocor-restore-finalize:
    <<: *ops
    profiles: [restore-drill]
    networks: [site, restore]
    depends_on:
      <<: *relays
      ocor-restore-load-postgresql: {condition: service_completed_successfully}
      ocor-restore-qdrant: {condition: service_healthy}
    command: [python3, /opt/ocor/ocor_ops_agent.py, restore-finalize, --profile, /etc/ocor/profile.json,
              --vault, /vault, --staging, /restore, --restore-qdrant, "ocor-restore-qdrant:6333"]
    volumes:
      - "${OCOR_BACKUP_VAULT_DIR:?required}:/vault"
      - "restore-staging:/restore"

networks:
  bootstrap:
    external: true
    name: ${OCOR_BOOTSTRAP_NETWORK:-ocor-bootstrap_ocor-bootstrap}
  site:
    internal: true
  restore:
    internal: true

volumes:
  # Project-scoped staging; the seal/finalize steps erase the plaintext they consumed.
  backup-staging: {}
  restore-staging: {}

configs:
  ocor-table-digest:
    content: |
      select format('select %L, count(*), coalesce(md5(string_agg(t::text, E''\n'' order by t::text)), '''') from %I.%I t', n.nspname || '.' || c.relname, n.nspname, c.relname)
      from pg_class c join pg_namespace n on n.oid = c.relnamespace
      where c.relkind = 'r' and n.nspname not in ('pg_catalog', 'information_schema') and n.nspname not like 'pg_toast%'
      order by 1 \gexec
  ocor-poc-profile:
    content: |
      {"backup":{"authorityAware":true,"authorityClasses":["definition","canonical","event","action","governance","audit","model_scenario","projection","key_custody"],"contentAddressed":true,"encrypted":true,"immutable":true,"keys":{"encryption":"ocor-poc-backup-enc","signing":"ocor-poc-backup-sign","transitMount":"ocor-poc-transit"},"memory":{"auditRefs":true,"boundToSameRecoveryPoint":true,"contentRefs":true,"deletionEpochs":true,"journalCheckpoints":true,"lifecycleEpochs":true,"metadataRef":"memory-metadata","representationVersions":true,"sources":{"database":"ocor_poc_drill","indexCollection":"ocor_poc_drill_memory","journalTable":"memory_deletion_journal","metadataTable":"memory_item"}},"offClusterFaultDomain":true,"rpoMinutes":15,"rtoHours":4,"signed":true,"tested":true},"health":{"dependencies":[{"faultClass":"canonical_writer_unavailable","host":"terminusdb","mandatory":true,"name":"terminusdb","port":6363,"probe":{"expectStatus":[200],"kind":"http","path":"/api/ok"}},{"faultClass":"projection_lag_or_failure","host":"typedb","mandatory":true,"name":"typedb","port":8000,"probe":{"expectStatus":[200,204],"kind":"http","path":"/health"}},{"faultClass":"projection_lag_or_failure","host":"fuseki","mandatory":true,"name":"fuseki","port":3030,"probe":{"expectStatus":[200],"kind":"http","path":"/$$/ping"}},{"faultClass":"idp_or_policy_engine_unavailable","host":"opa","mandatory":true,"name":"opa","port":8181,"probe":{"expectStatus":[200],"kind":"http","path":"/health"}},{"faultClass":"idp_or_policy_engine_unavailable","host":"keycloak","mandatory":true,"name":"keycloak","port":9000,"probe":{"expectBody":"\"status\": \"UP\"","expectStatus":[200],"kind":"http","path":"/health/ready"}},{"faultClass":"idp_or_policy_engine_unavailable","host":"openbao","mandatory":true,"name":"openbao","port":8200,"probe":{"expectStatus":[200],"kind":"http","path":"/v1/sys/health"}},{"additionalFaultClasses":["canonical_writer_unavailable"],"faultClass":"audit_append_unavailable","host":"postgresql","mandatory":true,"name":"postgresql","port":5432,"probe":{"database":"ocor","kind":"postgres_startup","user":"ocor"}},{"faultClass":"broker_unavailable","host":"kafka","mandatory":true,"name":"kafka","port":29092,"probe":{"kind":"kafka_api_versions"}},{"faultClass":"projection_lag_or_failure","host":"qdrant","mandatory":true,"name":"qdrant","port":6333,"probe":{"expectStatus":[200],"kind":"http","path":"/readyz"}},{"faultClass":"idp_or_policy_engine_unavailable","host":"spire-server","mandatory":true,"name":"spire-server","port":8081,"probe":{"kind":"tls_spiffe"}}],"probeTimeoutSeconds":3,"probeTypes":["liveness","readiness"]},"images":{"digestPinned":true,"pins":{"kafka":"confluentinc/cp-kafka@sha256:24cdd3a7fa89d2bed150560ebea81ff1943badfa61e51d66bb541a6b0d7fb047","ops":"python:3.11@sha256:c7220863385ee39fb6d822da81f4469d0cd33ff893d92ce94105e5c3f4b95fe2","postgresql":"postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20","qdrant":"qdrant/qdrant@sha256:d122138f76868edba68d36cb0833139c1d1761f00f09e48e61f8314196e6a4c6"},"publicNetworkDependencyAtRuntime":false,"registry":"local","signatureVerifiedBeforeAdmission":true},"isolation":{"allowedFlows":[{"host":"terminusdb","port":6363},{"host":"typedb","port":8000},{"host":"fuseki","port":3030},{"host":"opa","port":8181},{"host":"keycloak","port":9000},{"host":"openbao","port":8200},{"host":"postgresql","port":5432},{"host":"kafka","port":29092},{"host":"qdrant","port":6333},{"host":"spire-server","port":8081}],"backupVaultOutsideClusterFaultDomain":true,"egressDenyProbes":["1.1.1.1:443","registry.npmjs.org:443"],"egressPublicNetwork":false,"namespacePerSubsystem":true,"networkPolicyDefaultDeny":true,"rootCaOutsideClusterFaultDomain":true,"serviceAccountPerSubsystem":true,"syntheticCompartmentsMin":2,"zeroSaaSAndCallHome":true},"observability":{"driftScanIntervalSeconds":60,"exportersLocal":true,"logs":{"excludeClassifiedPayload":true,"fields":["correlation_id","component","operation","release","policy_digest","reason_code"],"keepClassificationMarking":true},"metrics":{"exporter":"prometheus","set":["latency_p50_p95_p99_per_contract","error_deny_approval_expiry_rate","projection_lag_watermark_checksum","commit_outbox_retry","constraint_violation","action_fsm_saga_execution_unknown","audit_gap","queue_run_time_budget","model_seed_scenario_ttl","configuration_schema_release_drift"]},"probeIntervalSeconds":5,"releaseMismatchBlocksMutativeCommand":true,"traces":{"fields":["trace_id","correlation_id","causation_id","governed_context_digest","effective_principal_id","actor_chain","tenant_id","organization_id","domain_id","compartments","classification_marking_ref","purpose","policy_bundle_digest","ontology_release_digest","canonical_commit","projection_watermark","policy_decision_id","scenario_id","model_digest","action_state"]}},"profile":{"deploymentTarget":"Design Target / Candidate Implementation","id":"poc","release":"ocor-poc-0.2.0","singleSite":true},"resourceClasses":["CONTROL","INTERACTIVE","BATCH","AUDIT"],"resourceIsolation":{"c6ControlAuditSharesCausalBatchPool":false},"resourceLimits":{"consolidationConcurrency":4,"embeddingDimensions":1536,"indexSizeBytes":1073741824,"itemCount":100000,"payloadSizeBytes":1048576,"quotaBehavior":{"onExceed":"quota_backpressure","semanticDowngrade":false},"retentionHorizonDays":30,"topK":100},"restore":{"isolatedNetwork":true,"receiptMaxAgeHours":168,"recoveryGate":["revision","watermark","orphan_duplicate","marking","gcs","deletion_resurrection","projection_drift_or_stale_deletion_epoch","sample_semantic_digest"],"replay":{"emitsNoExternalEffects":true,"pins":["ontology_release","compiler_logic_bundle","canonical_commit","event_schema","model_digest","policy_digest","seed","assumptions","ordering"],"seed":49,"usesOriginalEventIds":true},"steps":["containment_and_emergency_stop","select_signed_recovery_point_within_rpo","verify_trust_manifest_digest_signatures_dual_control","restore_oaC_ir_policy_config_model_manifests","restore_canonical_event_action_audit_same_cut","replay_memory_deletion_tombstones_before_reopen_retrieval","rebuild_logic_projection_and_w3c_boundary","reconcile_outbox_offset_checksum_saga_receipt","assign_execution_unknown_to_unprovable_effects","run_conformance_security_mission_thread_replay","require_human_authorization_to_reopen_mutative"]},"safeDegraded":{"faults":[{"behavior":["no_new_governed_operations","authorized_reads_only_if_policy_snapshot_valid"],"fault":"idp_or_policy_engine_unavailable"},{"behavior":["events_durably_queued","no_canonical_commit_confirmation","mutations_suspended"],"fault":"canonical_writer_unavailable"},{"behavior":["outbox_retained_relayed_later","no_projection_freshness_claim"],"fault":"broker_unavailable"},{"behavior":["PROJECTION_NOT_READY_or_STALE_CONTEXT","high_impact_blocked"],"fault":"projection_lag_or_failure"},{"behavior":["no_new_mutative_command"],"fault":"audit_append_unavailable"},{"behavior":["EXECUTION_UNKNOWN","status_inquiry_or_reconciliation_only","no_blind_retry"],"fault":"action_adapter_timeout"},{"behavior":["read_analyze_simulate_on_pinned_snapshot","explicit_staleness","no_high_impact"],"fault":"edge_partition"},{"behavior":["new_mutative_capabilities_denied_within_10_seconds"],"fault":"emergency_stop"}]}}
  ocor-ops-agent:
    content: |
      """OCOR PoC operations agent (OCOR-DEV-0049; ADD v1.3 Part I 6, Part II 2.13; LLD v1.1 5).

      Standard-library only; runs unchanged in the digest-pinned python:3.11 image of the
      Compose and Helm profiles. Subcommands:

        validate  fail-closed profile validation (LLD 5.2: invalid pin/config blocks startup)
        serve     persistent health/readiness/metrics/traces/posture endpoint (ADD 6.3)
        relay     relay of ONE allowed destination/port flow of the Compose default-deny network (ADD 6.1)
        relay-probe       health probe of a relay instance
        init-keys provision the OpenBao transit keys used for backup encryption/signature
        seal      build an encrypted, signed, content-addressed recovery point (ADD 6.4)
        restore-prepare   verify signature/digests and decrypt a recovery point (ADD 6.5 1-3)
        restore-finalize  restore the memory index, replay tombstones, run the recovery gate
                          and write a signed restore receipt (ADD 6.5 4-10, Part II 2.13)
