      # An image pin is `name@sha256:<64 lowercase hex>` (same rule as the Helm renderer).
      IMAGE_PIN = re.compile(r"^[a-z0-9]+([._/:-][a-z0-9]+)*@sha256:[0-9a-f]{64}$")
