# ADD v1.3 §6.1 / LLD v1.1 §5.1: default-deny ingress and egress for every pod of
# the namespace, then only the intra-site flows of `ocor.isolation.allowedFlows`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
  labels:
    {{- include "ocor-poc.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-intra-site
  labels:
    {{- include "ocor-poc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- /* One rule per allowed flow: the destination address AND its port only, so no
           destination can be reached on the port of another (ADD v1.3 §6.1). */}}
    {{- range $flow := .Values.ocor.isolation.allowedFlows }}
    {{- $ip := "" }}
    {{- range $.Values.operational.hostAliases }}
    {{- if has $flow.host .hostnames }}{{ $ip = .ip }}{{ end }}
    {{- end }}
    {{- if not $ip }}
    {{- fail (printf "operational.hostAliases is required: no intra-site address for allowed flow %s:%v" $flow.host $flow.port) }}
    {{- end }}
    - to:
        - ipBlock: {cidr: {{ printf "%s/32" $ip }}}
      ports:
        - {protocol: TCP, port: {{ $flow.port }}}
    {{- end }}
