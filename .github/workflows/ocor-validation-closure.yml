name: OCOR governance and validation closure

on:
  push:
    branches:
      - codex/validation-closure-v1.2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation-closure-part:
    # One deterministic part of the complete suite on its own runner and full
    # pinned stack (PO decision REM-0017-CI-CAMPAIGN-DURATION, 45-minute part limit).
    name: validation-closure part ${{ matrix.part }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
    concurrency:
      group: ocor-validation-closure-part-${{ matrix.part }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"

      - name: Set up pinned Node oracle
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.20.2"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install and verify pinned ruff executable
        run: |
          set -euo pipefail
          uv tool install ruff==0.13.1
          tool_bin="$(uv tool dir --bin)"
          echo "$tool_bin" >> "$GITHUB_PATH"
          "$tool_bin/ruff" --version
          python - "$tool_bin/ruff" <<'PYTHON'
          import hashlib
          import json
          import sys
          from pathlib import Path
          lock = json.loads(Path('infra/toolchain.lock.json').read_text())
          entry = next(tool for tool in lock['tools'] if tool['id'] == 'ruff')
          actual = hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest()
          if actual != entry['integrity']:
              raise SystemExit('Installed ruff digest differs from the governed lock')
          print(f"ruff {entry['version']}: SHA-256 matches governed lock")
          PYTHON

      - name: Synchronize locked runtime environment
        working-directory: ocor-runtime
        run: |
          set -euo pipefail
          uv sync --frozen --extra test --extra lint
          .venv/bin/python --version
          .venv/bin/python - <<'PY'
          from importlib.metadata import version
          for package in ("openapi-spec-validator", "rdflib", "psycopg", "pytest"):
              print(f"{package}=={version(package)}")
          PY

      - name: Build pinned TypeScript SDK and oracle
        working-directory: ocor-runtime/sdk/typescript
        run: |
          set -euo pipefail
          npm ci
          npm run build
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Reset or positively verify absence of the previous stack
        run: python3 scripts/bootstrap_ci_environment.py --teardown --execute

      - name: Resolve governed Fuseki content address
        id: fuseki-key
        run: python3 scripts/acquire_fuseki_archive.py --github-output >> "$GITHUB_OUTPUT"

      - name: Restore exact SHA512-addressed Fuseki archive
        id: fuseki-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.fuseki-key.outputs.path }}
          key: ${{ steps.fuseki-key.outputs.key }}

      - name: Provision the full pinned disposable stack
        run: |
          set -euo pipefail
          ocor-runtime/.venv/bin/python scripts/bootstrap_ci_environment.py --execute --timeout 600 | tee reports/tests/ci_bootstrap.log
          ocor-runtime/.venv/bin/python - <<'PYTHON'
          import os
          from pathlib import Path
          env_file = Path('.ocor/bootstrap.env').resolve()
          values = dict(line.split('=', 1) for line in env_file.read_text().splitlines() if '=' in line)
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              target.write(f"OCOR_BOOTSTRAP_ENV={env_file}\n")
              target.write(f"OCOR_LIVE_POSTGRES_DSN=postgresql://ocor:{values['OCOR_LOCAL_POSTGRES_PASSWORD']}@127.0.0.1:55433/ocor\n")
          for key, value in values.items():
              if key.endswith(('PASSWORD', 'TOKEN')):
                  print(f'::add-mask::{value}')
          PYTHON

      - name: Save verified Fuseki archive in this repository cache
        if: success() && steps.fuseki-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.fuseki-key.outputs.path }}
          key: ${{ steps.fuseki-key.outputs.key }}


      - name: Execute this zero-skip part of the complete runtime campaign on the real stack
        run: ocor-runtime/.venv/bin/python scripts/run_qualifying_campaign.py --execute --shard-index ${{ matrix.part }} --shard-count 4 --output-dir reports/tests/closure-part-${{ matrix.part }}

      - name: Teardown this disposable stack
        if: always()
        run: |
          set -euo pipefail
          mkdir -p reports/tests
          python3 scripts/bootstrap_ci_environment.py --teardown --execute | tee reports/tests/ci_teardown.log
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=ocor-bootstrap)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=ocor-bootstrap)"

      - name: Upload part results and teardown (aggregator input, not an evidence seal)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ocor-closure-full-part-${{ matrix.part }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            reports/tests/ci_*.log
            reports/tests/closure-part-${{ matrix.part }}/

  validation-closure:
    # Aggregator keeps the required check name; ruleset 23412233 is unchanged.
    needs: [validation-closure-part, conditional-infrastructure-0049]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
    concurrency:
      group: ocor-validation-closure-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Reject missing, failed or cancelled parts
        run: |
          set -euo pipefail
          test "${{ needs.validation-closure-part.result }}" = success
          test "${{ needs.conditional-infrastructure-0049.result }}" = success

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"

      - name: Set up pinned Node oracle
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.20.2"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install and verify pinned ruff executable
        run: |
          set -euo pipefail
          uv tool install ruff==0.13.1
          tool_bin="$(uv tool dir --bin)"
          echo "$tool_bin" >> "$GITHUB_PATH"
          "$tool_bin/ruff" --version
          python - "$tool_bin/ruff" <<'PYTHON'
          import hashlib
          import json
          import sys
          from pathlib import Path
          lock = json.loads(Path('infra/toolchain.lock.json').read_text())
          entry = next(tool for tool in lock['tools'] if tool['id'] == 'ruff')
          actual = hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest()
          if actual != entry['integrity']:
              raise SystemExit('Installed ruff digest differs from the governed lock')
          print(f"ruff {entry['version']}: SHA-256 matches governed lock")
          PYTHON

      - name: Synchronize locked runtime environment
        working-directory: ocor-runtime
        run: |
          set -euo pipefail
          uv sync --frozen --extra test --extra lint
          .venv/bin/python --version
          .venv/bin/python - <<'PY'
          from importlib.metadata import version
          for package in ("openapi-spec-validator", "rdflib", "psycopg", "pytest"):
              print(f"{package}=={version(package)}")
          PY

      - name: Build pinned TypeScript SDK and oracle
        working-directory: ocor-runtime/sdk/typescript
        run: |
          set -euo pipefail
          npm ci
          npm run build
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Reset or positively verify absence of the previous stack
        run: python3 scripts/bootstrap_ci_environment.py --teardown --execute

      - name: Resolve governed Fuseki content address
        id: fuseki-key
        run: python3 scripts/acquire_fuseki_archive.py --github-output >> "$GITHUB_OUTPUT"

      - name: Restore exact SHA512-addressed Fuseki archive
        id: fuseki-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.fuseki-key.outputs.path }}
          key: ${{ steps.fuseki-key.outputs.key }}

      - name: Provision the full pinned disposable stack
        run: |
          set -euo pipefail
          ocor-runtime/.venv/bin/python scripts/bootstrap_ci_environment.py --execute --timeout 600 | tee reports/tests/ci_bootstrap.log
          ocor-runtime/.venv/bin/python - <<'PYTHON'
          import os
          from pathlib import Path
          env_file = Path('.ocor/bootstrap.env').resolve()
          values = dict(line.split('=', 1) for line in env_file.read_text().splitlines() if '=' in line)
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              target.write(f"OCOR_BOOTSTRAP_ENV={env_file}\n")
              target.write(f"OCOR_LIVE_POSTGRES_DSN=postgresql://ocor:{values['OCOR_LOCAL_POSTGRES_PASSWORD']}@127.0.0.1:55433/ocor\n")
          for key, value in values.items():
              if key.endswith(('PASSWORD', 'TOKEN')):
                  print(f'::add-mask::{value}')
          PYTHON

      - name: Save verified Fuseki archive in this repository cache
        if: success() && steps.fuseki-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.fuseki-key.outputs.path }}
          key: ${{ steps.fuseki-key.outputs.key }}


      - name: Verify immutable source and report manifests
        run: |
          set -euo pipefail
          sha256sum -c inputs/normative/SHA256SUMS | tee reports/tests/post_remediation_input_checksums.txt
          sha256sum -c reports/OCOR_ADD_v1.2_SHA256SUMS | tee reports/tests/post_remediation_report_checksums.txt

      - name: Run complete post-remediation document harness
        run: |
          set -euo pipefail
          PY=ocor-runtime/.venv/bin/python
          "$PY" scripts/verify.py --add reports/OCOR_Architectural_Design_Document_v1.2_Candidate.md --json | tee reports/tests/post_remediation_verify.log
          mv reports/verify_report.json reports/tests/v12_verify_report_post_approval.json
          "$PY" reports/tests/test_v12_candidate.py | tee reports/tests/post_remediation_conformance.log
          "$PY" reports/tests/test_v12_semantics.py | tee reports/tests/post_remediation_semantics.log
          "$PY" reports/tests/test_v12_release_gate.py | tee reports/tests/post_remediation_release_gate.log
          "$PY" reports/tests/test_v12_approval_readiness.py | tee reports/tests/post_remediation_approval_readiness.log

      - name: Run governed OpenAPI 3.1 validation
        run: |
          set -euo pipefail
          ocor-runtime/.venv/bin/python reports/tests/validate_openapi_governed.py | tee reports/tests/post_remediation_openapi.log

      - name: Download every part of the parallel complete suite
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ocor-closure-full-part-*-${{ github.sha }}
          path: reports/tests/closure-parts

      - name: Aggregate the runtime parts and run BA, EV and live PostgreSQL campaigns
        working-directory: ocor-runtime
        run: |
          set -euo pipefail
          PY=.venv/bin/python
          # The parts' union must equal pytest --collect-only on this HEAD, with zero skips.
          "$PY" ../scripts/run_qualifying_campaign.py --execute --aggregate ../reports/tests/closure-parts --shard-count 4 --output-dir ../reports/tests
          "$PY" -m pytest -v --junitxml=../reports/tests/ba_junit_post_approval.xml tests/backend_assumptions/ | tee ../reports/tests/post_remediation_ba.log
          "$PY" -m pytest -v --junitxml=../reports/tests/ev_junit_post_approval.xml tests/acceptance_ev/ | tee ../reports/tests/post_remediation_ev.log
          "$PY" -m pytest -v --junitxml=../reports/tests/postgres_junit_post_approval.xml tests/integration/test_postgres_outbox_live.py | tee ../reports/tests/post_remediation_postgres.log

      - name: Execute conditional report guards and campaign supervisor tests
        run: |
          set -euo pipefail
          ocor-runtime/.venv/bin/python -m pytest -v --junitxml=reports/tests/guards_junit.xml reports/tests/test_generate_contracts_reference_resolution.py reports/tests/test_language_migration_benchmark_harness.py reports/tests/test_qualifying_campaign_guard.py reports/tests/test_fuseki_archive_acquisition.py reports/tests/test_kind_teardown_observation.py reports/tests/test_ci_fuseki_archive.py reports/tests/test_local_lane_campaign.py | tee reports/tests/ci_guards.log
          ocor-runtime/.venv/bin/python - <<'PYTHON'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from run_qualifying_campaign import check_junit
          print(check_junit(Path('reports/tests/guards_junit.xml')))
          PYTHON

      - name: Build governed closure evidence
        run: |
          set -euo pipefail
          ocor-runtime/.venv/bin/python reports/tests/build_validation_closure_report.py

      - name: Verify DEC-208 authoritative promotion
        run: |
          set -euo pipefail
          python reports/tests/build_dec208_approval_manifest.py
          python reports/tests/verify_dec208_authoritative_promotion.py
          ocor-runtime/.venv/bin/python reports/tests/validate_openapi_remediation_c.py

      - name: Teardown this disposable stack
        if: always()
        run: |
          set -euo pipefail
          mkdir -p reports/tests
          python3 scripts/bootstrap_ci_environment.py --teardown --execute | tee reports/tests/ci_teardown.log
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=ocor-bootstrap)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=ocor-bootstrap)"

      - name: Upload immutable evidence candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ocor-validation-closure-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            reports/tests/ci_*.log
            reports/tests/guards_junit.xml
            reports/tests/campaign_result.json
            reports/tests/docker-stats.log
            reports/OCOR_ADD_v1.2_Validation_Closure_Report.md
            reports/tests/*post_approval*
            reports/tests/post_remediation_*.log
            reports/tests/post_remediation_*checksums.txt
            reports/tests/openapi_31_validation_results.json
            reports/tests/validation_closure_results.json
            reports/tests/v12_conformance_results.json
            reports/tests/v12_semantic_results.json
            reports/tests/v12_release_gate_results.json
            reports/tests/v12_approval_readiness_results.json
            reports/tests/dec208_authoritative_promotion_results.json
            ocor-runtime/docs/governance_dossier/OCOR_ADD_v1.3_APPROVAL_SHA256SUMS

  conditional-infrastructure-0049-part:
    # TEST-INFRA-006 remains mandatory; 0049 is integrated and qualified at github.sha.
    # One deterministic part of the complete suite on its own runner and full
    # pinned stack (PO decision REM-0017-CI-CAMPAIGN-DURATION, 45-minute part limit).
    name: conditional-infrastructure-0049 part ${{ matrix.part }}/5
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5]
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
    concurrency:
      group: ocor-conditional-0049-part-${{ matrix.part }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"

      - name: Set up pinned Node oracle
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.20.2"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install and verify pinned ruff executable
        run: |
          set -euo pipefail
          uv tool install ruff==0.13.1
          tool_bin="$(uv tool dir --bin)"
          echo "$tool_bin" >> "$GITHUB_PATH"
          "$tool_bin/ruff" --version
          python - "$tool_bin/ruff" <<'PYTHON'
          import hashlib
          import json
