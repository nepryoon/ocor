          from pathlib import Path
          lock = json.loads(Path('infra/toolchain.lock.json').read_text())
          entry = next(tool for tool in lock['tools'] if tool['id'] == 'ruff')
          actual = hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest()
          if actual != entry['integrity']:
              raise SystemExit('Installed ruff digest differs from the governed lock')
          print(f"ruff {entry['version']}: SHA-256 matches governed lock")
          PYTHON

      - name: Synchronize locked runtime environment
        working-directory: ocor-runtime
        run: |
          set -euo pipefail
          uv sync --frozen --extra test --extra lint
          .venv/bin/python --version
          .venv/bin/python - <<'PY'
          from importlib.metadata import version
          for package in ("openapi-spec-validator", "rdflib", "psycopg", "pytest"):
              print(f"{package}=={version(package)}")
          PY

      - name: Acquire official checksum-pinned Kubernetes qualification tools
        run: |
          set -euo pipefail
          ocor-runtime/.venv/bin/python scripts/provision_qualification_tools.py --execute | tee reports/tests/ci_qualification_tools.log

      - name: Build pinned TypeScript SDK and oracle
        working-directory: ocor-runtime/sdk/typescript
        run: |
          set -euo pipefail
          npm ci
          npm run build
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Reset or positively verify absence of the previous stack
        run: python3 scripts/bootstrap_ci_environment.py --teardown --execute

      - name: Resolve governed Fuseki content address
        id: fuseki-key
        run: python3 scripts/acquire_fuseki_archive.py --github-output >> "$GITHUB_OUTPUT"

      - name: Restore exact SHA512-addressed Fuseki archive
        id: fuseki-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.fuseki-key.outputs.path }}
          key: ${{ steps.fuseki-key.outputs.key }}

      - name: Provision the full pinned disposable stack
        run: |
          set -euo pipefail
          ocor-runtime/.venv/bin/python scripts/bootstrap_ci_environment.py --execute --timeout 600 | tee reports/tests/ci_bootstrap.log
          ocor-runtime/.venv/bin/python - <<'PYTHON'
          import os
          from pathlib import Path
          env_file = Path('.ocor/bootstrap.env').resolve()
          values = dict(line.split('=', 1) for line in env_file.read_text().splitlines() if '=' in line)
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              target.write(f"OCOR_BOOTSTRAP_ENV={env_file}\n")
              target.write(f"OCOR_LIVE_POSTGRES_DSN=postgresql://ocor:{values['OCOR_LOCAL_POSTGRES_PASSWORD']}@127.0.0.1:55433/ocor\n")
          for key, value in values.items():
              if key.endswith(('PASSWORD', 'TOKEN')):
                  print(f'::add-mask::{value}')
          PYTHON

      - name: Save verified Fuseki archive in this repository cache
        if: success() && steps.fuseki-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.fuseki-key.outputs.path }}
          key: ${{ steps.fuseki-key.outputs.key }}


      - name: Run this part of the current FULL suite with TEST-INFRA-005 and 006
        run: |
          set -euo pipefail
          ocor-runtime/.venv/bin/python scripts/run_qualifying_campaign.py --execute --repository . --expected-head "${{ github.sha }}" --shard-index ${{ matrix.part }} --shard-count 5 --output-dir reports/tests/candidate-0049-part-${{ matrix.part }}

      - name: Teardown test-owned resources and the disposable stack
        if: always()
        run: |
          set -euo pipefail
          cleanup_status=0
          if test -x .ocor/tools/bin/kind; then
            timeout 300 .ocor/tools/bin/kind delete cluster --name ocor-poc || cleanup_status=1
          fi
          python3 scripts/bootstrap_ci_environment.py --teardown --execute | tee reports/tests/ci_candidate_teardown.log || cleanup_status=1
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=ocor-bootstrap)" || cleanup_status=1
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=ocor-bootstrap)" || cleanup_status=1
          test -z "$(docker ps -aq --filter name=ocor-poc-)" || cleanup_status=1
          exit "$cleanup_status"

      - name: Upload part results and teardown (aggregator input, not an evidence seal)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ocor-conditional-0049-part-${{ matrix.part }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            reports/tests/ci_*.log
            reports/tests/candidate-0049-part-${{ matrix.part }}/

  conditional-infrastructure-0049:
    # Stackless aggregator: every part ran on its own runner and full pinned stack.
    needs: conditional-infrastructure-0049-part
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
    concurrency:
      group: ocor-conditional-0049-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Reject missing, failed or cancelled parts
        run: |
          set -euo pipefail
          test "${{ needs.conditional-infrastructure-0049-part.result }}" = success

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Synchronize locked runtime environment
        working-directory: ocor-runtime
        run: uv sync --frozen --extra test --extra lint

      - name: Download every part of the parallel complete suite
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ocor-conditional-0049-part-*-${{ github.sha }}
          path: reports/tests/candidate-0049-parts

      - name: Aggregate current-revision parts and prove their union equals pytest --collect-only on the same HEAD
        run: |
          set -euo pipefail
          mkdir -p reports/tests
          ocor-runtime/.venv/bin/python scripts/run_qualifying_campaign.py --execute --aggregate reports/tests/candidate-0049-parts --repository . --expected-head "${{ github.sha }}" --shard-count 5 --output-dir reports/tests/candidate-0049 | tee reports/tests/ci_candidate_aggregate.log

      - name: Upload current-revision guard execution (not an evidence seal)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ocor-conditional-0049-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            reports/tests/ci_*.log
            reports/tests/candidate-0049/
