name: OCOR tooling and bootstrap policy

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  type-and-lint-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact checked-out head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12.11"}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with: {version: "0.12.5"}
      - uses: actions/setup-node@v4
        with: {node-version: "20.20.2"}
      - name: Restore pinned Python environment
        run: |
          uv sync --project ocor-runtime --frozen --extra test --extra lint
          uv tool install ruff==0.13.1
      - name: "mypy --strict (DEC-212 Phase 2.1: ocor-runtime/src and scripts)"
        run: ocor-runtime/.venv/bin/python -m mypy
      - name: ruff check, repository-wide (DEC-212 Phase 2.1)
        run: ruff check .
      - name: "tsc --strict (DEC-212 Phase 2.3: TypeScript SDK)"
        working-directory: ocor-runtime/sdk/typescript
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Contract generator reference-resolution remediation (OCOR-DEV-REM-0010)
        run: ocor-runtime/.venv/bin/python -m pytest -q reports/tests/test_generate_contracts_reference_resolution.py
      - name: NFR-022 cross-SDK conformance (DEC-212 Phase 2.3)
        run: ocor-runtime/.venv/bin/python -m pytest -q ocor-runtime/tests/sdk/test_typescript_sdk_conformance.py
      - name: Backlog generator reality-parity regression (DEC-212 Phase 2.4)
        run: ocor-runtime/.venv/bin/python -m pytest -q reports/tests/test_backlog_generator_reality_parity.py
      - name: Runtime evidence validator fail-closed gate (OCOR-DEV-REM-0016)
        run: ocor-runtime/.venv/bin/python -m pytest -q reports/tests/test_runtime_evidence_validator.py
      - name: Evidence input drift validator fail-closed gate (R3)
        run: ocor-runtime/.venv/bin/python -m pytest -q reports/tests/test_evidence_input_drift.py
      - name: Phase 3 language-migration benchmark harness guards (DEC-212 Phase 3)
        run: ocor-runtime/.venv/bin/python -m pytest -q reports/tests/test_language_migration_benchmark_harness.py
  tooling-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact checked-out head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12.11"}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with: {version: "0.12.5"}
      - name: Restore pinned Python environment
        run: |
          uv sync --project ocor-runtime --frozen --extra test
          uv tool install ruff==0.13.1
      - name: Validate lock schemas and instances
        run: |
          ocor-runtime/.venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          for name in ("toolchain", "services"):
              schema = json.loads(Path(f"infra/{name}.lock.schema.json").read_text())
              data = json.loads(Path(f"infra/{name}.lock.json").read_text())
              Draft202012Validator.check_schema(schema)
              Draft202012Validator(schema, format_checker=FormatChecker()).validate(data)
          PY
      - name: Run positive and negative tooling acceptance
        run: >-
          ocor-runtime/.venv/bin/python -m unittest -v
          reports.tests.test_autonomous_tooling_policy
          reports.tests.test_bootstrap_lock_validation
      - name: Validate manifests and Compose rendering
        run: |
          python3 scripts/preflight_environment.py --contract-only
          ruff check reports/tests/test_autonomous_tooling_policy.py reports/tests/test_bootstrap_lock_validation.py scripts/ocor_bootstrap_lib.py scripts/preflight_environment.py
          python3 scripts/bootstrap_development_environment.py --check
          python3 scripts/verify_external_services.py --manifest-only
          python3 scripts/reset_test_environment.py
          OCOR_LOCAL_TERMINUSDB_PASSWORD=x \
          OCOR_LOCAL_KEYCLOAK_PASSWORD=x \
          OCOR_LOCAL_OPENBAO_TOKEN=x \
          OCOR_LOCAL_POSTGRES_PASSWORD=x \
          OCOR_LOCAL_SEAWEEDFS_PASSWORD=x \
          OCOR_LOCAL_TEMPORAL_POSTGRES_PASSWORD=x \
          OCOR_SPIRE_BOOTSTRAP_DIR=/tmp \
          OCOR_SPIRE_JOIN_TOKEN=x \
          docker compose -f deploy/bootstrap/compose.yaml config --quiet
      - name: Validate RCCAD and immutable inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          PLAN_BASE="$BASE_SHA"
          if [[ "$HEAD_REF" == task/OCOR-DEV-* ]]; then
            PLAN_BASE=HEAD
          fi
          ocor-runtime/.venv/bin/python scripts/validate_ocor_development_plan.py --base-ref "$PLAN_BASE" --authorized-extension
          ocor-runtime/.venv/bin/python scripts/validate_rccad.py --base-ref "$BASE_SHA"
          git diff --exit-code "$BASE_SHA" -- inputs/
      - name: Validate language policy (DEC-212)
        run: |
          ocor-runtime/.venv/bin/python -m unittest -v reports.tests.test_validate_language_policy
          ocor-runtime/.venv/bin/python scripts/validate_language_policy.py
      - name: Validate evidence input drift against HEAD (R3)
        run: ocor-runtime/.venv/bin/python scripts/validate_evidence_input_drift.py --root .
