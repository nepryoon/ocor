name: OCOR supply-chain gates

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: false
    env:
      OCOR_SCAN_ROOT: .
      OCOR_SCAN_OUTPUT: /tmp/ocor-supply-chain
      OCOR_SCANNER_VERSION: 1.1.0
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
      - name: Run pinned in-repository scanners
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import hashlib
          import json
          import os
          import re
          import sys
          import tomllib
          from pathlib import Path

          root = Path(os.environ["OCOR_SCAN_ROOT"]).resolve()
          output = Path(os.environ["OCOR_SCAN_OUTPUT"]).resolve()
          version = os.environ["OCOR_SCANNER_VERSION"]
          output.mkdir(parents=True, exist_ok=True)
          excluded = {".git", ".ocor", ".venv", "__pycache__"}
          text_suffixes = {".json", ".md", ".proto", ".py", ".toml", ".ttl", ".txt", ".yaml", ".yml"}

          def candidates(suffixes: set[str]):
              for path in sorted(root.rglob("*")):
                  if not path.is_file() or path.suffix.lower() not in suffixes:
                      continue
                  relative = path.relative_to(root)
                  if excluded & set(relative.parts) or output == path or output in path.parents:
                      continue
                  if path.stat().st_size <= 2_000_000:
                      yield path, relative.as_posix()

          def write(name: str, findings: list[dict[str, object]]) -> None:
              payload = {
                  "blocking_findings": len(findings),
                  "findings": sorted(findings, key=lambda item: (str(item["path"]), str(item["rule_id"]))),
                  "result": "FAIL" if findings else "PASS",
                  "scanner": f"ocor-{name}-scanner",
                  "scanner_version": version,
              }
              (output / f"{name}.json").write_text(
                  json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
              )

          static_findings: list[dict[str, object]] = []
          for path, relative in candidates({".py"}):
              source = path.read_text(encoding="utf-8")
              try:
                  tree = ast.parse(source, filename=relative)
              except SyntaxError as exc:
                  static_findings.append(
                      {"line": exc.lineno or 0, "path": relative, "rule_id": "PYTHON_SYNTAX_ERROR", "severity": "CRITICAL"}
                  )
                  continue
              for node in ast.walk(tree):
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id in {"eval", "exec"}:
                      static_findings.append(
                          {"line": node.lineno, "path": relative, "rule_id": "DYNAMIC_CODE_EXECUTION", "severity": "HIGH"}
                      )
                  if isinstance(node, ast.Call) and any(
                      keyword.arg == "shell" and isinstance(keyword.value, ast.Constant) and keyword.value.value is True
                      for keyword in node.keywords
                  ):
                      static_findings.append(
                          {"line": node.lineno, "path": relative, "rule_id": "SUBPROCESS_SHELL_TRUE", "severity": "CRITICAL"}
                      )
          write("static", static_findings)

          secret_patterns = {
              "AWS_ACCESS_KEY": re.compile(r"AKIA[0-9A-Z]{16}"),
              "GITHUB_TOKEN": re.compile(r"gh[pousr]_[A-Za-z0-9]{36,}"),
              "PRIVATE_KEY": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
          }
          # This append-only authority belongs to the workflow checkout, independently of
          # OCOR_SCAN_ROOT (which the unchanged scanner tests point at temporary fixtures).
          # No environment override can select a different registry. New entries need PO authority.
          checkout = next((directory for directory in (Path.cwd(), *Path.cwd().parents) if (directory / ".git").exists()), Path.cwd())
          registry_path = checkout / "reports/assurance/OCOR-DEV-REM-0034-RCCAD/synthetic-secret-occurrences.json"
          approved_registry = {'decision': 'REM-0019-SEALED-SYNTHETIC-SECRET-SCANNER (2026-10-15), option 1',
           'entries': [{'decision': 'REM-0019-SEALED-SYNTHETIC-SECRET-SCANNER (2026-10-15), option 1',
                        'element': 1,
                        'field': 'regression_case_identity',
                        'file_sha256': '0e37bcb00cd57560cb74342d00b08a04c8fda7abaac0e762a8bab688dfefdee7',
                        'id': 'REM0034-140',
                        'index': 140,
                        'path': 'reports/evidence/G5/OCOR-DEV-0050.requalified-rem0019-marker.json',
                        'provenance': {'commit': '6e1c4b050ac610a22673d6f559e424a01705189c',
                                       'function': 'test_secrets_credentials_tokens_and_hidden_reasoning_inside_allowed_classes_are_refused',
                                       'path': 'ocor-runtime/tests/tasks/test_ocor_dev_0050.py'},
                        'rule_id': 'PRIVATE_KEY',
                        'string_sha256': 'face5b9e01f3f67cd66a05b7f769d7c9794db20c89608f1738d6f8ed045d277a'},
                       {'decision': 'REM-0019-SEALED-SYNTHETIC-SECRET-SCANNER (2026-10-15), option 1',
                        'element': 1,
                        'field': 'regression_case_identity',
                        'file_sha256': '0e37bcb00cd57560cb74342d00b08a04c8fda7abaac0e762a8bab688dfefdee7',
                        'id': 'REM0034-141',
                        'index': 141,
                        'path': 'reports/evidence/G5/OCOR-DEV-0050.requalified-rem0019-marker.json',
                        'provenance': {'commit': '6e1c4b050ac610a22673d6f559e424a01705189c',
                                       'function': 'test_secrets_credentials_tokens_and_hidden_reasoning_inside_allowed_classes_are_refused',
                                       'path': 'ocor-runtime/tests/tasks/test_ocor_dev_0050.py'},
                        'rule_id': 'AWS_ACCESS_KEY',
                        'string_sha256': '588b75fc376710d8d592238d317df325417a1734200818620e5dde8e8d51c5bb'},
                       {'decision': 'REM-0019-SEALED-SYNTHETIC-SECRET-SCANNER (2026-10-15), option 1',
                        'element': 1,
                        'field': 'regression_case_identity',
                        'file_sha256': '0e37bcb00cd57560cb74342d00b08a04c8fda7abaac0e762a8bab688dfefdee7',
                        'id': 'REM0034-175',
                        'index': 175,
                        'path': 'reports/evidence/G5/OCOR-DEV-0050.requalified-rem0019-marker.json',
                        'provenance': {'commit': '6e1c4b050ac610a22673d6f559e424a01705189c',
                                       'function': 'test_same_idempotency_key_revalidates_payload_before_returning_receipt',
                                       'path': 'ocor-runtime/tests/tasks/test_ocor_dev_0050.py'},
                        'rule_id': 'PRIVATE_KEY',
                        'string_sha256': 'fe135a59f6261b411db6f713e7249c545a745bb72619c42a5d3ba1068fffea61'}],
           'schema_version': '1.0'}
          secret_findings: list[dict[str, object]] = []
          suspended_findings: list[dict[str, object]] = []
          registry_entries = []
          try:
              def unique_object(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise ValueError("duplicate JSON key")
                      result[key] = value
                  return result

              registry = json.loads(registry_path.read_text(encoding="utf-8"), object_pairs_hook=unique_object)
              # Structural equality also pins provenance, rules and all approved binding fields.
              # Canonical bytes reject duplicate/coerced types (e.g. true in place of index 1).
              if json.dumps(registry, sort_keys=True) != json.dumps(approved_registry, sort_keys=True):
                  raise ValueError("registry differs from the three PO-authorized entries")
              registry_entries = registry["entries"]
          except (OSError, UnicodeDecodeError, ValueError, TypeError):
              secret_findings.append({"line": 0, "path": "reports/assurance/OCOR-DEV-REM-0034-RCCAD/synthetic-secret-occurrences.json", "rule_id": "SYNTHETIC_REGISTRY_INVALID", "severity": "CRITICAL"})

          # Validate registered authority bytes before lexical selection or UTF-8
          # decoding can skip a file. This checks only the registered authority
          # path; candidates(), patterns and the 2 MB selection stay intact.
          for relative in sorted({entry["path"] for entry in registry_entries}):
              registered = root / relative
              expected_digest = next(entry["file_sha256"] for entry in registry_entries if entry["path"] == relative)
              if registered.is_file() and (registered.stat().st_size > 2_000_000 or hashlib.sha256(registered.read_bytes()).hexdigest() != expected_digest):
                  secret_findings.append({"line": 0, "path": relative, "rule_id": "SYNTHETIC_RECORD_BINDING_INVALID", "severity": "CRITICAL"})

          for path, relative in candidates(text_suffixes):
              try:
                  source = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              authorized_spans = []
              entries = [entry for entry in registry_entries if entry["path"] == relative]
              if entries:
                  try:
                      if hashlib.sha256(path.read_bytes()).hexdigest() != entries[0]["file_sha256"]:
                          raise ValueError("sealed record digest differs")
                      document = json.loads(source, object_pairs_hook=unique_object)
                      # The immutable file hash fixes its structure. Locate the unique raw JSON
                      # string token whose decoded value equals the field/index/element value;
                      # only pattern matches wholly inside that exact token can be suspended.
                      tokens = [(m.start(), m.end(), json.loads(m.group())) for m in re.finditer(r'"(?:[^"\\]|\\.)*"', source)]
                      for entry in entries:
                          value = document[entry["field"]][entry["index"]][entry["element"]]
                          if not isinstance(value, str) or hashlib.sha256(value.encode("utf-8")).hexdigest() != entry["string_sha256"]:
                              raise ValueError("field/index/string binding differs")
                          locations = [(start, end) for start, end, token in tokens if token == value]
                          if len(locations) != 1:
                              raise ValueError("ambiguous string location")
                          start, end = locations[0]
                          matches = list(secret_patterns[entry["rule_id"]].finditer(source, start, end))
                          if len(matches) != 1:
                              raise ValueError("authorized occurrence is not unique")
                          match = matches[0]
                          authorized_spans.append((entry["rule_id"], match.start(), match.end(), entry["id"]))
                  except (ValueError, KeyError, IndexError, TypeError):
                      authorized_spans = []
                      secret_findings.append({"line": 0, "path": relative, "rule_id": "SYNTHETIC_RECORD_BINDING_INVALID", "severity": "CRITICAL"})
              for rule_id, pattern in secret_patterns.items():
                  for match in pattern.finditer(source):
                      finding = {
                          "line": source.count("\n", 0, match.start()) + 1,
                          "path": relative,
                          "rule_id": rule_id,
                          "severity": "CRITICAL",
                      }
                      entry_id = next((ident for rule, start, end, ident in authorized_spans if (rule, start, end) == (rule_id, match.start(), match.end())), None)
                      if entry_id is None:
                          secret_findings.append(finding)
                      else:
                          suspended_findings.append(finding | {"registry_entry_id": entry_id, "decision": approved_registry["decision"]})
          write("secrets", secret_findings)
          # Keep the normal report contract and disclose every suspension in both summaries.
          secret_report = json.loads((output / "secrets.json").read_text(encoding="utf-8"))
          secret_report["suspended_findings"] = suspended_findings
          (output / "secrets.json").write_text(json.dumps(secret_report, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          lock_path = root / "ocor-runtime/uv.lock"
          dependency_findings: list[dict[str, object]] = []
          components: list[dict[str, object]] = []
          denied_licenses = {"AGPL-3.0", "AGPL-3.0-only", "GPL-3.0", "GPL-3.0-only", "SSPL-1.0"}
          try:
              lock = tomllib.loads(lock_path.read_text(encoding="utf-8"))
          except (OSError, tomllib.TOMLDecodeError) as exc:
              dependency_findings.append(
                  {"path": "ocor-runtime/uv.lock", "rule_id": "LOCK_UNREADABLE", "severity": "CRITICAL", "detail": str(exc)}
              )
              lock = {"package": []}
          for package in sorted(lock.get("package", []), key=lambda item: (item.get("name", ""), item.get("version", ""))):
              name = str(package.get("name", ""))
              package_version = str(package.get("version", ""))
              license_name = package.get("license")
              if not name or not package_version:
                  dependency_findings.append(
                      {"path": "ocor-runtime/uv.lock", "rule_id": "UNVERSIONED_DEPENDENCY", "severity": "CRITICAL"}
                  )
                  continue
              if license_name in denied_licenses:
                  dependency_findings.append(
                      {
                          "detail": str(license_name),
                          "path": f"pkg:pypi/{name}@{package_version}",
                          "rule_id": "DISALLOWED_LICENSE",
                          "severity": "HIGH",
                      }
                  )
              artifacts: list[dict[str, object]] = []
              if isinstance(package.get("sdist"), dict):
                  artifacts.append(package["sdist"])
              artifacts.extend(item for item in package.get("wheels", []) if isinstance(item, dict))
              source = package.get("source", {})
              registry_package = isinstance(source, dict) and "registry" in source
              hashes = sorted({str(item.get("hash", "")) for item in artifacts if item.get("hash")})
              if registry_package and (not hashes or any(re.fullmatch(r"sha256:[0-9a-f]{64}", value) is None for value in hashes)):
                  dependency_findings.append(
                      {
                          "path": f"pkg:pypi/{name}@{package_version}",
                          "rule_id": "MISSING_OR_INVALID_ARTIFACT_HASH",
                          "severity": "CRITICAL",
                      }
                  )
              component: dict[str, object] = {
                  "name": name,
                  "purl": f"pkg:pypi/{name}@{package_version}",
                  "type": "library",
                  "version": package_version,
              }
              if hashes:
                  component["hashes"] = [
                      {"alg": "SHA-256", "content": value.removeprefix("sha256:")} for value in hashes
                  ]
              if license_name:
                  component["licenses"] = [{"license": {"id": str(license_name)}}]
              components.append(component)
          write("dependencies", dependency_findings)

          lock_digest = hashlib.sha256(lock_path.read_bytes()).hexdigest() if lock_path.is_file() else ""
          sbom = {
              "bomFormat": "CycloneDX",
              "components": components,
              "metadata": {
                  "component": {"name": "ocor-runtime", "type": "application"},
                  "properties": [
                      {"name": "ocor:lock:sha256", "value": lock_digest},
                      {"name": "ocor:scanner:version", "value": version},
                  ],
              },
              "serialNumber": f"urn:uuid:{lock_digest[:8]}-{lock_digest[8:12]}-{lock_digest[12:16]}-{lock_digest[16:20]}-{lock_digest[20:32]}",
              "specVersion": "1.5",
              "version": 1,
          }
          (output / "sbom.cdx.json").write_text(
              json.dumps(sbom, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          blockers = len(static_findings) + len(secret_findings) + len(dependency_findings)
          summary = {
              "blocking_findings": blockers,
              "result": "FAIL" if blockers else "PASS",
              "scanner": "ocor-supply-chain",
              "scanner_version": version,
          }
          if suspended_findings:
              summary["suspended_findings"] = suspended_findings
          (output / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(summary, sort_keys=True))
          raise SystemExit(1 if blockers else 0)
          PY
      - name: Upload machine-readable findings and SBOM
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ocor-supply-chain-${{ github.sha }}
          path: /tmp/ocor-supply-chain/*.json
          if-no-files-found: error
          retention-days: 90
